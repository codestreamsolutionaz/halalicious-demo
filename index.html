\n   PICTURE: illustrated truck parked under an Arizona sunset, saguaros behind\n   COLOUR and TYPE: oxblood ground, saffron accent, white; Archivo 900 + Source Sans 3\n   LAYOUT: hero scene, locations, price-board menu with cart, how it works, footer */\n:root{color-scheme:light dark;\n--bg:light-dark(#fffaf0,#1a120e);--ink:light-dark(#1f1612,#f8eedc);--mute:light-dark(#6b5444,#cbb49a);\n--ox:#361e14;--ox2:#1f1612;--saf:#f7c21e;--rust:#ab401f;--leaf:#3c8b37;--cream:#f9e2bf;--card:light-dark(#ffffff,#2a1c15);--line:light-dark(#ecdcbf,#4a3226)}\n:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}\n*{box-sizing:border-box;min-width:0}\nhtml{scroll-behavior:smooth;scroll-padding-top:72px}\nbody{margin:0;background:var(--bg);color:var(--ink);font:17px/1.55 \"Source Sans 3\",system-ui,sans-serif;overflow-x:clip}\nh1,h2,h3{font-family:Archivo,system-ui,sans-serif;line-height:1.05;text-wrap:balance;margin:0}\nh2{font-size:clamp(32px,5vw,48px);font-weight:900}\na{color:inherit}\n.band{padding:clamp(36px,5vw,72px) max(5vw,16px)}\n.wrap{max-width:1240px;margin:0 auto}\nbutton,input,select,textarea{font:inherit;font-size:16px}\n.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 22px;border-radius:999px;border:0;font-weight:700;text-decoration:none;cursor:pointer}\n.btn.y{background:var(--saf);color:#1f1612}.btn.o{background:transparent;color:#fff;box-shadow:inset 0 0 0 2px #ffffff88}\n.btn:focus-visible,button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--saf);outline-offset:2px}\n/* nav */\nnav{position:sticky;top:0;z-index:20;background:var(--ox2);color:#fff}\nnav .wrap{display:flex;align-items:center;gap:16px;padding:10px max(5vw,16px);flex-wrap:wrap}\n.logo{font:900 22px/1 Archivo,sans-serif;text-decoration:none;display:flex;align-items:center;gap:10px}\n.logo b{color:var(--saf)}\n.links{display:flex;gap:4px;margin-left:auto;flex-wrap:wrap}\n.links a{text-decoration:none;padding:10px 12px;border-radius:8px;font-weight:600}\n.links a:hover{background:#ffffff1a}\n.cartbtn{background:var(--saf);color:#1f1612;border:0;border-radius:999px;min-height:44px;padding:0 16px;font-weight:800;cursor:pointer}\n/* hero */\n.hero{background:linear-gradient(180deg,var(--ox2),var(--ox));color:#fff;padding-bottom:0}\n.hero .wrap{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:32px;align-items:end}\n.hero h1{font-size:clamp(40px,6.4vw,72px);font-weight:900}\n.hero p{font-size:19px;max-width:34ch;color:#f3e2c4}\n.badges{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0 24px}\n.badges span{background:#ffffff1f;border-radius:999px;padding:6px 14px;font-weight:600;font-size:15px}\n.cta{display:flex;gap:12px;flex-wrap:wrap;padding-bottom:40px}\n.scene{width:100%;height:auto;display:block}\n/* locations */\n.locs{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:16px;margin-top:28px}\n.loc{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px;display:flex;flex-direction:column;gap:8px}\n.loc .tag{align-self:flex-start;font-size:14px;font-weight:700;padding:4px 12px;border-radius:999px;background:var(--saf);color:#1f1612}\n.loc .tag.t{background:var(--ox);color:#fff}\n.loc h3{font-size:26px;font-weight:800}\n.loc address{font-style:normal;color:var(--mute)}\n.loc .row{display:flex;gap:10px;flex-wrap:wrap;margin-top:auto;padding-top:10px}\n.loc .btn{min-height:44px;padding:0 16px;font-size:16px}\n.loc .btn.m{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 2px var(--line)}\n.loc .btn.s{background:var(--ox);color:#fff}\n.loc.on{outline:3px solid var(--saf)}\n.note{font-size:14px;color:var(--mute);margin-top:14px}\n/* menu */\n.menu{background:var(--ox);color:#fff}\n.menu .sub{color:#f3e2c4;max-width:60ch}\n.tabs{display:flex;gap:8px;overflow-x:auto;padding:22px 0 6px;scrollbar-width:thin}\n.tabs button{flex:none;min-height:44px;padding:0 18px;border-radius:999px;border:0;background:#ffffff1a;color:#fff;font-weight:700;cursor:pointer}\n.tabs button[aria-pressed=true]{background:var(--saf);color:#1f1612}\n.search{width:100%;max-width:420px;min-height:48px;border-radius:12px;border:0;padding:0 16px;margin-top:12px;background:#fff;color:#1f1612}\n.board{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px;margin-top:22px}\n.item{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 12px;align-items:center;background:#fffaf0;color:#1f1612;border-radius:14px;padding:14px 16px}\n.item .n{font-weight:700;line-height:1.25}\n.item .plu{font-size:13px;color:#7a6050}\n.item .p{font:800 20px/1 Archivo,sans-serif;white-space:nowrap;text-align:right}\n.item .p small{font:600 13px \"Source Sans 3\",sans-serif;color:#7a6050}\n.item .ask{font:700 14px \"Source Sans 3\",sans-serif;color:#7a6050;white-space:nowrap}\n.qty{grid-column:1/-1;display:flex;align-items:center;gap:8px;justify-content:flex-end}\n.qty button{width:44px;height:44px;border-radius:12px;border:0;background:var(--ox);color:#fff;font-size:22px;font-weight:700;cursor:pointer}\n.qty .add{width:auto;padding:0 18px;font-size:16px}\n.qty output{min-width:64px;text-align:center;font-weight:700;white-space:nowrap}\n.empty{padding:30px;text-align:center;color:#f3e2c4}\n/* steps */\n.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:20px;margin-top:26px}\n.step{border-top:4px solid var(--saf);padding-top:14px}\n.step h3{font-size:22px;font-weight:800;margin-bottom:6px}\n.step p{margin:0;color:var(--mute)}\n.halal{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:24px;margin-top:30px;display:grid;grid-template-columns:auto minmax(0,1fr);gap:18px;align-items:center}\nfooter{background:var(--ox2);color:#f3e2c4}\nfooter .wrap{display:flex;gap:24px;justify-content:space-between;flex-wrap:wrap}\nfooter a{color:#fff}\n/* cart drawer */\n.drawer{position:fixed;inset:0;z-index:50;display:none}\n.drawer.open{display:block}\n.shade{position:absolute;inset:0;background:#0008}\n.panel{position:absolute;right:0;top:0;bottom:0;width:min(440px,100%);background:var(--bg);color:var(--ink);display:flex;flex-direction:column;box-shadow:-10px 0 40px #0006}\n.panel header{display:flex;justify-content:space-between;align-items:center;padding:18px 20px;background:var(--ox2);color:#fff}\n.panel header h2{font-size:26px}\n.x{width:44px;height:44px;border-radius:12px;border:0;background:#ffffff22;color:#fff;font-size:22px;cursor:pointer}\n.lines{flex:1;overflow:auto;padding:8px 20px}\n.line{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;padding:12px 0;border-bottom:1px solid var(--line)}\n.line .r{text-align:right;font-weight:700;white-space:nowrap}\n.line .c{grid-column:1/-1;display:flex;gap:8px;align-items:center}\n.line .c button{min-width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}\n.form{padding:16px 20px;border-top:1px solid var(--line);display:grid;gap:10px}\n.form label{font-weight:600;font-size:15px;display:grid;gap:4px}\n.form input,.form select,.form textarea{min-height:46px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:8px 12px}\n.tot{display:flex;justify-content:space-between;font:800 20px Archivo,sans-serif}\n.err{color:#d23a3a;font-weight:600;font-size:15px;min-height:1em}\n.fine{font-size:13px;color:var(--mute)}\n@media(max-width:820px){.hero .wrap{grid-template-columns:1fr}.cta{padding-bottom:8px}}\n@media(max-width:600px){.links{display:none}.halal{grid-template-columns:1fr}}\n@media(prefers-reduced-motion:no-preference){.wheel{transform-box:fill-box;transform-origin:center;animation:sp 3s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}}\n.item .ph{grid-column:1/-1;width:calc(100% + 32px);margin:-14px -16px 4px;aspect-ratio:4/3;object-fit:cover;border-radius:14px 14px 0 0;display:block;background:#f1e3c8}\n.loc .sched{margin:0;font-weight:600}\n.announce{background:var(--saf);color:#1f1612;text-align:center;font-weight:700;padding:10px max(5vw,16px)}\n.closed #openCart,.closed .qty,.closed .loc .btn.s{display:none}\n.noprice .item .p,.noprice .item .ask,.noprice .line .r,.noprice .tot,.noprice .line .fine{display:none}\n.pick{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:10px}\n.form .pick label{font-weight:600;font-size:15px;display:grid;gap:4px}\n.form .pick select{min-height:46px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:8px 12px}\n[hidden]{display:none!important}\n\n/* Brand from the Halalicious logo: cream ground, dark brown, rust truck, halal green, yellow */\n.logo img{width:44px;height:auto;display:block}\n.hero{background:radial-gradient(120% 90% at 75% 40%,#fcf3cc 0,var(--cream) 55%,#f1d3a4 100%);color:#1f1612}\n.hero h1{color:#361e14}.hero p{color:#53261a}\n.hero .badges span{background:#361e1414;color:#361e14}\n.hero .btn.y{background:var(--rust);color:#fff}\n.hero .btn.o{color:#361e14;box-shadow:inset 0 0 0 2px #361e1466}\n.hero .wrap{align-items:center}\n.scene{width:min(520px,100%);justify-self:center;filter:drop-shadow(0 18px 30px #361e1440);padding:8px 0 40px}\n.qty button,.loc .btn.s{background:var(--rust)}\n.loc .tag.t{background:var(--rust)}\n.loc .tag{background:var(--saf)}\n.halal svg circle:first-child{fill:var(--leaf)}\n\n/* Specials, preparation options, pre-orders */\n.specials{background:var(--cream);padding-block:clamp(24px,4vw,44px)}\n.specials h2{color:#361e14}\n.splist{display:flex;gap:12px;padding:16px 0 4px;scroll-snap-type:x mandatory}\n.sp{flex:none;scroll-snap-align:start;width:210px;min-height:96px;display:grid;gap:4px;align-content:start;text-align:left;background:#fffaf0;border:2px solid #361e1422;border-radius:16px;padding:12px;cursor:pointer;color:#1f1612;font:inherit}\n.sp img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radi d the Valley.\u003c/p>\u003c/div>\n    \u003cdiv class=\"step\">\u003ch3>Build your order\u003c/h3>\u003cp>Add cuts by the pound from the price board. Add notes like \"cut curry size\" or \"skin off\".\u003c/p>\u003c/div>\n    \u003cdiv class=\"step\">\u003ch3>Send on WhatsApp\u003c/h3>\u003cp>Your order goes to us as a WhatsApp message. We confirm it, cut it fresh and have it ready when you arrive.\u003c/p>\u003c/div>\n  \u003c/div>\n  \u003cdiv class=\"halal\">\n    \u003csvg width=\"72\" height=\"72\" viewBox=\"0 0 72 72\" aria-hidden=\"true\">\u003ccircle cx=\"36\" cy=\"36\" r=\"34\" fill=\"#361e14\"/>\u003ccircle cx=\"36\" cy=\"36\" r=\"27\" fill=\"none\" stroke=\"#f7c21e\" stroke-width=\"3\"/>\u003cpath d=\"M24 37l8 8 16-18\" fill=\"none\" stroke=\"#fff\" stroke-width=\"6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>\u003c/svg>\n    \u003cdiv>\u003ch3 style=\"font-size:24px;font-weight:800;margin-bottom:6px\">Zabiha halal, every cut\u003c/h3>\u003cp style=\"margin:0;color:var(--mute)\">Hand-slaughtered and hand-cut, sold fresh from our own store and trucks.\u003c/p>\u003c/div>\n  \u003c/div>\n\u003c/div>\u003c/section>\n\n\u003cfooter class=\"band\">\u003cdiv class=\"wrap\">\n  \u003cdiv>\u003cdiv class=\"logo\" style=\"color:#fff\">\u003cspan class=\"brand-name\">Halalicious Meats\u003c/span>\u003c/div>\u003cp>Zabiha halal meat on wheels · Arizona\u003c/p>\u003c/div>\n  \u003cdiv>\u003cstrong style=\"color:#fff\">WhatsApp &amp; calls\u003c/strong>\u003cp>\u003ca id=\"ftel\" href=\"#\">\u003c/a>\u003c/p>\u003c/div>\n  \u003cdiv>\u003cstrong style=\"color:#fff\">Storefront\u003c/strong>\u003cp>330 S Gilbert Rd, Suite 16\u003cbr>Mesa, AZ 85204\u003c/p>\u003c/div>\n\u003c/div>\u003cdiv class=\"wrap\">\u003cp class=\"fine\" style=\"color:#f3e2c4aa\">© 2026 Halalicious. Site by WeDigitiz.\u003c/p>\u003c/div>\u003c/footer>\n\n\u003cdiv class=\"drawer\" id=\"drawer\" aria-hidden=\"true\">\n  \u003cdiv class=\"shade\" id=\"shade\">\u003c/div>\n  \u003caside class=\"panel\" role=\"dialog\" aria-modal=\"true\" aria-labelledby=\"ct\">\n    \u003cheader>\u003ch2 id=\"ct\">Cart &amp; checkout\u003c/h2>\u003cbutton class=\"x\" id=\"closeCart\" aria-label=\"Close\">×\u003c/button>\u003c/header>\n    \u003cdiv class=\"lines\" id=\"lines\">\u003c/div>\n    \u003cdiv class=\"form\" id=\"form\">\n      \u003cdiv class=\"tot\">\u003cspan>Estimated\u003c/span>\u003cspan id=\"est\">$0.00\u003c/span>\u003c/div>\n      \u003clabel>Pickup location\u003cselect id=\"where\">\u003c/select>\u003c/label>\n      \u003clabel>Your name\u003cinput id=\"nm\" autocomplete=\"name\" maxlength=\"80\">\u003c/label>\n      \u003clabel>Phone\u003cinput id=\"ph\" type=\"tel\" autocomplete=\"tel\" maxlength=\"20\">\u003c/label>\n      \u003cdiv class=\"pick\">\u003clabel>Pickup day\u003cselect id=\"pday\">\u003c/select>\u003c/label>\u003clabel>Time\u003cselect id=\"ptime\">\u003c/select>\u003c/label>\u003c/div>\n      \u003cp class=\"fine\" id=\"slotMsg\" hidden>\u003c/p>\n      \u003clabel>Notes\u003ctextarea id=\"notes\" rows=\"2\" placeholder=\"Cut size, skin on/off, cleaning\" maxlength=\"500\">\u003c/textarea>\u003c/label>\n      \u003cdiv class=\"err\" id=\"err\" role=\"alert\">\u003c/div>\n      \u003cbutton class=\"btn y\" id=\"send\" type=\"button\">Place order\u003c/button>\n      \u003cp class=\"fine\">\u003cspan id=\"payText\">Pay at pickup by card, cash or Zelle.\u003c/span> The estimate leaves out \"Ask for price\" items.\u003c/p>\n    \u003c/div>\n    \u003cdiv class=\"form\" id=\"done\" hidden>\n      \u003ch3 style=\"font-size:24px;font-weight:800\">Order \u003cspan id=\"oid\">\u003c/span> received\u003c/h3>\n      \u003cp style=\"margin:0\">Send it to us on WhatsApp so we can confirm and start cutting.\u003c/p>\n      \u003cp class=\"fine\" id=\"payDone\" style=\"margin:0\">\u003c/p>\n      \u003ca class=\"btn y\" id=\"wa\" href=\"#\" target=\"_blank\" rel=\"noopener\">Open WhatsApp\u003c/a>\n      \u003cbutton class=\"btn\" id=\"again\" type=\"button\" style=\"background:var(--card);color:var(--ink);box-shadow:inset 0 0 0 2px var(--line)\">Start a new order\u003c/button>\n    \u003c/div>\n  \u003c/aside>\n\u003c/div>\n\n\u003cscript>// Halalicious storefront. Menu, locations and settings come from the Node backend.\n{\nconst $ = s => document.querySelector(s);\nconst money = v => '$' + v.toFixed(2);\nconst esc = s => String(s).replace(/[&\u003c>\"']/g, c => ({'&':'&amp;','\u003c':'&lt;','>':'&gt;','\"':'&quot;',\"'\":'&#39;'}[c]));\n\nlet CATS = [], LOCS = [], ITEMS = {}, CFG = {}, GROUPS = {};\n// cart: { key: { plu, qty, opts: { groupId: choice } } } — one line per item + preparation choice\nlet cart = {}, tab = 'All', loc = 'mesa';\ntry {\n  const saved = JSON.parse(localStorage.getItem('hl-cart2') || '{}');\n  cart = saved && typeof saved === 'object' ? saved : {};\n  loc = localStorage.getItem('hl-loc') || 'mesa';\n} catch (e) {}\nconst save = () => { try { localStorage.setItem('hl-cart2', JSON.stringify(cart)); localStorage.setItem('hl-loc', loc); } catch (e) {} };\nconst maps = l => 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(l.address + ', ' + l.cityLine);\nconst priceOf = i => i.specialPrice ?? i.price;\nconst step = i => i.unit === 'lb' ? 0.5 : 1;\nconst fmtQ = (i, q) => i.unit === 'lb' ? q + ' lb' : i.unit === 'pack' ? q + (q === 1 ? ' pack' : ' packs') : q + ' pc';\nconst keyOf = (plu, opts) => plu + '|' + Object.keys(opts).sort().map(k => k + '=' + opts[k]).join(';');\nconst optText = opts => Object.entries(opts || {}).map(([g, v]) => v).join(' · ');\n\nfunction renderLocs() {\n  $('#locs').innerHTML = LOCS.map(l => `\u003cdiv class=\"loc${l.id === loc ? ' on' : ''}\">\u003cspan class=\"tag${l.kind === 'Truck' ? ' t' : ''}\">${esc(l.kind)}\u003c/span>\u003ch3>${esc(l.city)}\u003c/h3>\u003caddress>${esc(l.address)}\u003cbr>${esc(l.cityLine)}\u003c/address>${l.hours ? `\u003cp class=\"sched\">${esc(l.hours)}\u003c/p>` : ''}${l.schedule ? `\u003cp class=\"fine\" style=\"margin:0\">${esc(l.schedule)}\u003c/p>` : ''}\n  \u003cdiv class=\"row\">\u003cbutton class=\"btn s\" data-loc=\"${l.id}\">Start your order\u003c/button>\u003ca class=\"btn m\" href=\"${maps(l)}\" target=\"_blank\" rel=\"noopener\">Directions\u003c/a>\u003c/div>\u003c/div>`).join('');\n  const opts = LOCS.map(l => `\u003coption value=\"${l.id}\"${l.id === loc ? ' selected' : ''}>${esc(l.city)} ${l.kind.toLowerCase()} · ${esc(l.address)}\u003c/option>`).join('');\n  $('#where').innerHTML = opts;\n}\nfunction renderTabs() {\n  $('#tabs').innerHTML = ['All', ...CATS.map(c => c.name)].map(t => `\u003cbutton data-tab=\"${esc(t)}\" aria-pressed=\"${t === tab}\">${esc(t)}\u003c/button>`).join('');\n}\nconst priceHtml = i => i.price == null && i.specialPrice == null ? '\u003cdiv class=\"ask\">Ask for price\u003c/div>'\n  : i.specialPrice != null ? `\u003cdiv class=\"p\">\u003cs>${i.price != null ? money(i.price) : ''}\u003c/s>${money(i.specialPrice)}\u003csmall>/${i.unit}\u003c/small>\u003c/div>`\n  : `\u003cdiv class=\"p\">${money(i.price)}\u003csmall>/${i.unit}\u003c/small>\u003c/div>`;\nfunction inCart(plu) {\n  const lines = Object.values(cart).filter(l => l.plu === plu); if (!lines.length) return '';\n  const i = ITEMS[plu]; return `\u003cspan class=\"inc\">In cart: ${fmtQ(i, lines.reduce((s, l) => s + l.qty, 0))}\u003c/span>`;\n}\nfunction renderSpecials() {\n  const sp = Object.values(ITEMS).filter(i => i.specialPrice != null);\n  $('#specials').hidden = !sp.length;\n  $('#specialList').innerHTML = sp.map(i => `\u003cbutton class=\"sp\" data-show=\"${i.plu}\">${i.image ? `\u003cimg src=\"${esc(i.image)}\" alt=\"\" loading=\"lazy\">` : ''}\u003cspan class=\"spn\">${esc(i.name)}\u003c/span>\u003cspan class=\"spp\">${i.price != null ? `\u003cs>${money(i.price)}\u003c/s> ` : ''}\u003cb>${money(i.specialPrice)}\u003c/b>/${i.unit}\u003c/span>\u003c/button>`).join('');\n}\nfunction renderBoard() {\n  const q = $('#q').value.trim().toLowerCase();\n  const list = Object.values(ITEMS).filter(i => (tab === 'All' || i.category === tab) && (!q || i.name.toLowerCase().includes(q) || String(i.plu).includes(q)));\n  $('#board').innerHTML = list.length ? list.map(i => `\u003cdiv class=\"item${i.specialPrice != null ? ' special' : ''}\" id=\"item-${i.plu}\">${i.image ? `\u003cimg class=\"ph\" src=\"${esc(i.image)}\" alt=\"${esc(i.name)}\" loading=\"lazy\">` : ''}\u003cdiv>\u003cdiv class=\"n\">${esc(i.name)}${i.specialPrice != null ? ' \u003cspan class=\"badge\">Special\u003c/span>' : ''}\u003c/div>\u003cdiv class=\"plu\">PLU ${i.plu} · ${esc(i.category)}\u003c/div>\u003c/div>\n  ${priceHtml(i)}\n  ${(i.options || []).filter(g => GROUPS[g]).length ? `\u003cdiv class=\"opts\">${i.options.filter(g => GROUPS[g]).map(g => `\u003clabel>${esc(GROUPS[g].label)}\u003cselect data-opt=\"${g}\">${GROUPS[g].choices.map(c => `\u003coption>${esc(c)}\u003c/option>`).join('')}\u003c/select>\u003c/label>`).join('')}\u003c/div>` : ''}\n  \u003cdiv class=\"qty\">${inCart(i.plu)}\u003cbutton class=\"add\" data-add=\"${i.plu}\">Add ${i.unit === 'lb' ? '½ lb' : i.unit === 'pack' ? '1 pack' : '1'}\u003c/button>\u003c/div>\u003c/div>`).join('') : '\u003cdiv class=\"empty\">No items match that search.\u003c/div>';\n}\nconst total = () => Object.values(cart).reduce((s, l) => s + (priceOf(ITEMS[l.plu]) || 0) * l.qty, 0);\n\nfunction renderCart() {\n  const ks = Object.keys(cart).filter(k => ITEMS[cart[k].plu]);\n  $('#cc').textContent = ks.length;\n  $('#lines').innerHTML = ks.length ? ks.map(k => { const l = cart[k], i = ITEMS[l.plu], p = priceOf(i); return `\u003cdiv class=\"line\">\u003cdiv>\u003cstrong>${esc(i.name)}\u003c/strong>\u003cdiv class=\"fine\">PLU ${i.plu}${p != null ? ' · ' + money(p) + '/' + i.unit : ' · ask for price'}${l.opts && Object.keys(l.opts).length ? '\u003cbr>' + esc(optText(l.opts)) : ''}\u003c/div>\u003c/div>\u003cdiv class=\"r\">${p != null ? money(p * l.qty) : '—'}\u003c/div>\n  \u003cdiv class=\"c\">\u003cbutton data-d=\"${esc(k)}\" aria-label=\"Less\">−\u003c/button>\u003cspan>${fmtQ(i, l.qty)}\u003c/span>\u003cbutton data-i=\"${esc(k)}\" aria-label=\"More\">+\u003c/button>\u003cbutton data-r=\"${esc(k)}\" style=\"margin-left:auto\">Remove\u003c/button>\u003c/div>\u003c/div>`; }).join('') : '\u003cp class=\"fine\" style=\"padding:20px 0\">Your cart is empty. Add items from the price board.\u003c/p>';\n  $('#est').textContent = money(total());\n}\nfunction add(plu) {\n  const i = ITEMS[plu]; if (!i) return;\n  const card = document.getElementById('item-' + plu), opts = {};\n  if (card) card.querySelectorAll('[data-opt]').forEach(s => { opts[s.dataset.opt] = s.value; });\n  const k = keyOf(plu, opts);\n  cart[k] = { plu: Number(plu), opts, qty: Math.min(+(((cart[k] && cart[k].qty) || 0) + step(i)).toFixed(1), 50) };\n  save(); renderBoard(); renderCart();\n}\nfunction change(k, dir) {\n  const l = cart[k]; if (!l) return; const i = ITEMS[l.plu];\n  const n = +(l.qty + dir * step(i)).toFixed(1);\n  if (n \u003c= 0) delete cart[k]; else l.qty = Math.min(n, 50);\n  save(); renderBoard(); renderCart();\n}\n// Pickup days and times come from the owner's hours for the chosen location.\nlet SLOTS = [];\nasync function loadSlots() {\n  const day = $('#pday'), time = $('#ptime'), msg = $('#slotMsg');\n  day.innerHTML = '\u003coption>Loading…\u003c/option>'; time.innerHTML = '';\n  try { SLOTS = await fetch('/api/locations/' + encodeURIComponent(loc) + '/slots').then(r => r.json()); } catch (e) { SLOTS = []; }\n  if (!Array.isArray(SLOTS) || !SLOTS.length) {\n    SLOTS = []; day.innerHTML = '\u003coption value=\"\">No times available\u003c/option>'; time.innerHTML = '';\n    msg.textContent = 'This location has no open pickup times right now. Try another location or message us on WhatsApp.'; msg.hidden = false; return;\n  }\n  msg.hidden = true;\n  day.innerHTML = SLOTS.map(d => `\u003coption value=\"${d.date}\">${esc(d.label)}\u003c/option>`).join('');\n  fillTimes();\n}\nfunction fillTimes() {\n  const d = SLOTS.find(x => x.date === $('#pday').value);\n  $('#ptime').innerHTML = d ? d.times.map(t => `\u003coption value=\"${t.time}\"${t.full ? ' disabled' : ''}>${t.label}${t.full ? ' (full)' : ''}\u003c/option>`).join('') : '';\n  const first = d && d.times.find(t => !t.full); if (first) $('#ptime').value = first.time;\n}\nfunction openCart() { loadSlots(); $('#drawer').classList.add('open'); $('#drawer').setAttribute('aria-hidden', 'false'); $('#closeCart').focus(); }\nfunction closeCart() { $('#drawer').classList.remove('open'); $('#drawer').setAttribute('aria-hidden', 'true'); }\nfunction showForm(on) { $('#form').hidden = !on; $('#done').hidden = on; }\nconst payLine = () => `Pay at pickup by card, cash or Zelle${CFG.zelleName ? ` (to ${CFG.zelleName})` : ''}. Your final price is weighed fresh.`;\n\nasync function placeOrder() {\n  let m = '';\n  if (!Object.keys(cart).length) m = 'Add at least one item.';\n  else if (!$('#nm').value.trim()) m = 'Please add your name.';\n  else if (!$('#ph').value.trim()) m = 'Please add your phone number.';\n  else if (!$('#pday').value || !$('#ptime').value) m = 'Please choose a pickup day and time.';\n  $('#err').textContent = m; if (m) return;\n  const btn = $('#send'); btn.disabled = true; btn.textContent = 'Placing order…';\n  try {\n    const r = await fetch('/api/orders', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({\n      name: $('#nm').value.trim(), phone: $('#ph').value.trim(), pickupDate: $('#pday').value, pickupTime: $('#ptime').value, notes: $('#notes').value.trim(), location: loc,\n      lines: Object.values(cart).map(l => ({ plu: l.plu, qty: l.qty, options: l.opts }))\n    }) });\n    const d = await r.json();\n    if (r.status === 409) loadSlots(); // that slot was taken; refresh the choices\n    if (!r.ok) throw new Error(d.error || 'Something went wrong.');\n    $('#oid').textContent = d.id; $('#wa').href = d.whatsappUrl; $('#payDone').textContent = payLine();\n    cart = {}; save(); renderBoard(); renderCart(); showForm(false);\n  } catch (e) { $('#err').textContent = e.message || 'Could not place the order. Please try again.'; }\n  finally { btn.disabled = false; btn.textContent = 'Place order'; }\n}\n\ndocument.addEventListener('click', e => {\n  const t = e.target.closest('button'); if (!t) return;\n  if (t.dataset.add) add(t.dataset.add);\n  else if (t.dataset.i) change(t.dataset.i, 1);\n  else if (t.dataset.d) change(t.dataset.d, -1);\n  else if (t.dataset.r) { delete cart[t.dataset.r]; save(); renderBoard(); renderCart(); }\n  else if (t.dataset.tab) { tab = t.dataset.tab; renderTabs(); renderBoard(); }\n  else if (t.dataset.loc) { loc = t.dataset.loc; save(); renderLocs(); $('#menu').scrollIntoView(); }\n  else if (t.dataset.show) { tab = 'All'; $('#q').value = ''; renderTabs(); renderBoard(); const el = document.getElementById('item-' + t.dataset.show); if (el) { el.scrollIntoView({ block: 'center' }); el.classList.add('flash'); setTimeout(() => el.classList.remove('flash'), 1600); } }\n});\n$('#q').addEventListener('input', renderBoard);\n$('#openCart').addEventListener('click', openCart);\n$('#closeCart').addEventListener('click', closeCart);\n$('#shade').addEventListener('click', closeCart);\n$('#send').addEventListener('click', placeOrder);\n$('#again').addEventListener('click', () => { showForm(true); loadSlots(); });\ndocument.addEventListener('keydown', e => { if (e.key === 'Escape') closeCart(); });\n$('#where').addEventListener('change', e => { loc = e.target.value; save(); renderLocs(); loadSlots(); });\n$('#pday').addEventListener('change', fillTimes);\n\nasync function init() {\n  try {\n    const [m, l, c] = await Promise.all(['/api/menu', '/api/locations', '/api/config'].map(u => fetch(u).then(r => r.json())));\n    CATS = m; LOCS = l; CFG = c;\n    GROUPS = Object.fromEntries((CFG.optionGroups || []).map(g => [g.id, g]));\n    CATS.forEach(cat => cat.items.forEach(i => { ITEMS[i.plu] = { ...i, unit: i.unit || 'lb', category: cat.name }; }));\n    if (!LOCS.some(x => x.id === loc)) loc = LOCS[0] ? LOCS[0].id : '';\n    for (const [k, v] of Object.entries(cart)) if (!v || !ITEMS[v.plu]) delete cart[k]; // drop items the owner has hidden or deleted\n    save();\n    document.querySelectorAll('.brand-name').forEach(el => { el.textContent = CFG.storeName; });\n    document.title = CFG.storeName;\n    $('#ftel').textContent = CFG.phoneDisplay; $('#ftel').href = 'https://wa.me/' + CFG.whatsapp;\n    $('#payText').textContent = payLine();\n    if (CFG.announcement) { $('#announce').textContent = CFG.announcement; $('#announce').hidden = false; }\n    document.body.classList.toggle('closed', !CFG.orderingOpen);\n    document.body.classList.toggle('noprice', !CFG.showPrices);\n    if (!CFG.orderingOpen) $('#menu .sub').textContent = 'Online ordering is paused right now. Message us on WhatsApp to order.';\n    if (LOCS.length) $('#cities').textContent = [...new Set(LOCS.map(l => l.city))].join(' · ');\n    // Seasonal pre-orders (e.g. Qurbani): only a small link here; the form has its own page.\n    if (CFG.preorder && CFG.preorder.on) {\n      $('#poBar').hidden = false; $('#poBarText').textContent = CFG.preorder.title;\n    }\n    renderLocs(); renderTabs(); renderSpecials(); renderBoard(); renderCart();\n  } catch (e) { console.error(e); $('#board').innerHTML = '\u003cdiv class=\"empty\">The menu could not load. Please refresh.\u003c/div>'; }\n}\ninit();\n}\n\u003c/script>\n\u003c/body>\n\u003c/html>\n","admin":"\u003c!DOCTYPE html>\n\u003chtml lang=\"en\">\n\u003chead>\n\u003cmeta charset=\"utf-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\n\u003cmeta name=\"robots\" content=\"noindex\">\u003cscript>\nwindow.fetch=(u,o)=>parent.demoFetch(u,o);\nwindow.open=()=>{parent.demoNote('Printing labels works on the live site.');return{document:{write(){},close(){}},focus(){},print(){}}};\nconst _c=HTMLAnchorElement.prototype.click;\nHTMLAn 6l7+J/j9CMplNVtJdswAAAABJRU5ErkJggg==\">\n\u003cstyle>\n:root{color-scheme:light dark;--bg:light-dark(#fffaf0,#1a120e);--ink:light-dark(#1f1612,#f8eedc);--mute:light-dark(#6b5444,#cbb49a);--line:light-dark(#ecdcbf,#4a3226);--card:light-dark(#fff,#2a1c15);--ox:#361e14;--saf:#f7c21e}\n*{box-sizing:border-box;min-width:0}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,sans-serif}\nheader{background:#1f1612;color:#fff;padding:12px max(4vw,16px);display:flex;gap:10px;align-items:center;flex-wrap:wrap;position:sticky;top:0;z-index:5}\nh1{font-size:20px;margin:0 auto 0 0}h2{font-size:18px;margin:0}\ninput,select,button,textarea{font:inherit;font-size:16px;min-height:44px;border-radius:10px;border:1px solid var(--line);padding:0 12px;background:var(--card);color:var(--ink)}\ntextarea{padding:8px 12px}\nbutton,label.btn{cursor:pointer;font-weight:700}\n.y{background:var(--saf);color:#1f1612;border:0}.r{background:transparent;color:#c62828;border-color:#c6282855}.g{background:transparent}\nbutton:focus-visible,input:focus-visible,select:focus-visible,label.btn:focus-within{outline:3px solid var(--saf);outline-offset:1px}\nnav{display:flex;gap:6px;padding:12px max(4vw,16px) 0;max-width:1100px;margin:auto;overflow-x:auto}\nnav button{flex:none;background:transparent;border:0;border-bottom:3px solid transparent;border-radius:0}\nnav button[aria-pressed=true]{border-color:var(--ox);color:var(--ox)}\nmain{padding:16px max(4vw,16px);display:grid;gap:12px;max-width:1100px;margin:auto}\n.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.bar input[type=search]{flex:1 1 220px}\n.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;display:grid;gap:8px}\n.off{opacity:.6}\n.row{display:grid;grid-template-columns:72px minmax(0,1fr) auto;gap:12px;align-items:center}\n.thumb{width:72px;height:72px;border-radius:10px;object-fit:cover;background:var(--line);display:grid;place-items:center;font-size:12px;color:var(--mute);text-align:center}\n.acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}\n.acts button,.acts label.btn{min-height:40px;padding:0 12px;font-size:15px}\nlabel.btn{display:inline-flex;align-items:center;min-height:44px;padding:0 14px;border:1px solid var(--line);border-radius:10px;background:var(--card);position:relative}\nlabel.btn input{position:absolute;opacity:0;width:1px;height:1px}\n.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}\n.grid label{display:grid;gap:4px;font-size:14px;font-weight:600}\n.bc{display:flex;gap:6px}.bc input{flex:1}\n.sw{display:inline-flex;align-items:center;gap:8px;font-weight:600;cursor:pointer}\n.sw input{width:22px;height:22px;min-height:0;flex:none}\n.set{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 16px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}\n.set:first-of-type{border-top:0}.set p{margin:0;color:var(--mute);font-size:14px;grid-column:1}\n.set .sw{grid-row:1/3;grid-column:2}\n.barcode svg{height:34px;width:auto;display:block}\n.pill{font-size:13px;font-weight:700;padding:2px 10px;border-radius:999px;background:var(--ox);color:#fff}.pill.ok{background:#1d7a3a}\n.m{color:var(--mute);font-size:14px}ul{margin:0;padding-left:18px}\n.hit{outline:3px solid var(--saf)}\n.errs{color:#c62828;font-size:14px;max-height:180px;overflow:auto}\n.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#1f1612;color:#fff;padding:12px 18px;border-radius:12px;font-weight:600;z-index:9;max-width:90vw}\n.cam{position:fixed;inset:0;background:#000d;z-index:8;display:grid;place-items:center;gap:12px;padding:16px}\n.cam video{width:min(520px,100%);border-radius:12px}\nfieldset.hrs{border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:0;display:grid;gap:6px;min-inline-size:0}\n[hidden]{display:none!important}\nfieldset.hrs legend{font-weight:700;padding:0 6px}\n.hr{display:grid;grid-template-columns:76px minmax(0,1fr) auto minmax(0,1fr);gap:6px;align-items:center}\n.hr input[type=time]{min-height:40px;padding:0 6px;width:100%;font-size:15px}\n.hrs .bar button{white-space:normal;text-align:left}\n@media(max-width:520px){.hr{grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);padding:4px 0;border-top:1px solid var(--line)}.hr .sw{grid-column:1/-1}}\n.chips{display:flex;flex-wrap:wrap;gap:6px}.chip{display:inline-flex;align-items:center;gap:4px;background:var(--line);border-radius:999px;padding:2px 4px 2px 12px;font-size:14px;font-weight:600}\n.chip button{min-height:32px;width:32px;padding:0;border:0;background:transparent;font-size:18px}\n.cd{display:grid;gap:6px}\n.optpick{display:flex;flex-wrap:wrap;gap:6px 16px;align-items:center;font-size:14px;margin-top:4px}.optpick span{font-weight:700}\ntextarea{font:inherit;font-size:16px}\ndetails summary{cursor:pointer;font-weight:700;min-height:44px;display:flex;align-items:center}\n@media(max-width:560px){.row{grid-template-columns:56px minmax(0,1fr)}.thumb{width:56px;height:56px}.acts{grid-column:1/-1;justify-content:flex-start}}\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\u003cheader>\u003cimg src=\"data:image/webp;base64,UklGRtopAABXRUJQVlA4WAoAAAAQAAAAnwAAlAAAQUxQSLwFAAABBgrUtpmRrEp6sLZt27Zt27Zt27Zt27Zt27udVJ0znfRU0kn2+n4VERDctpEkxXNPQbNHtVPdPckDYBXJfgQoMvOWSt9srBeWwCXgKBIyQbR2p5hOt4ckJJCd44HkGZ9m7BsGKJSBqmD4Oi8XAVyST8Na7FLrfzEoKtNJdTNgfSnNP9T2bAFEaOZhuynzKqqA4VSDcAQuYXd2ihFPGFSFsuAlVIb7g5MQwE+yMbvg8m8aNqdUwfB1eUF7oiUhE0RscdoLm/uBYMDpFhE9LiLZjp1u9FPt/DYk3Q/2dGI6G6G1hirKbFJ42EbQYlMlfw/aNimg7QUt2zRRwYCrnWMSSFZHS4IA6Se+5HIK42iV4e2cHBZHy4JAKrfFbYxteBvdWz2kddGyJgWcYYCR8aZso7d6xdegLeljCQY91rJ9KSGAD/NyadCW87GMsz4aZ5vnIthfM9CDthI7oOI2lccpfIq+1i2OJZKFbobG7HyFa7r7HP1uVjYN2gK5Pcfst5rpEIwsgt5dNcC3aCGA0HX2Mp7pbhU0Ay53iqlB+4ydoP89rtxuMfSbaZk1K3yfOEWeRV8YlGDZVkTTjWX8CIRstlOEqnuIAW4fsk1eE1xoF02DNjEFxOp928JszhX+yzGpNGiTnCLbjHc8bOujf64tIXvQJjhFrb2Uh20T9JlW4QlcwqBT9LltqRTgg6XfkxHJNGhudoEFn3jYdkN/X1VU8qB52GEbHGM8bFuiTzaL6EEHx048+KFtnMKcHblRKbyhhSYFf " aria-pressed=\"false\">Settings\u003c/button>\u003c/nav>\n\u003cmain id=\"view\">\u003cp class=\"m\">Enter the admin token from the .env file to manage orders, inventory, locations and settings.\u003c/p>\u003c/main>\n\u003cdiv id=\"toast\" class=\"toast\" hidden role=\"status\">\u003c/div>\n\u003cscript type=\"module\">\nconst { svg, inStoreCode, isValidGtin, parseScaleLabel } = parent.Barcode;\nconst { DAY_NAMES, hoursSummary, defaultPickup } = parent.Slots;\nconst { optionGroupsText } = parent.Catalog;\nconst $=s=>document.querySelector(s);\nconst esc=s=>String(s??'').replace(/[&\u003c>\"']/g,c=>({'&':'&amp;','\u003c':'&lt;','>':'&gt;','\"':'&quot;',\"'\":'&#39;'}[c]));\nconst money=v=>v==null?'Ask for price':'$'+Number(v).toFixed(2);\nconst ST=['new','confirmed','ready','picked-up','cancelled'];\nlet tab='orders',items=[],locs=[],settings={},q='',cat='All',editing=null,armed=null,hit=null,importRows=null,importResult=null,newBarcode='';\ntry{$('#tok').value=sessionStorage.getItem('hl-tok')||''}catch(e){}\nfunction toast(t){const el=$('#toast');el.textContent=t;el.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>el.hidden=true,2800)}\nconst auth=()=>({Authorization:'Bearer '+$('#tok').value});\nasync function api(url,opt={}){\n  const r=await fetch(url,{...opt,headers:{...auth(),'Content-Type':'application/json'}});\n  const d=await r.json().catch(()=>({}));\n  if(r.status===401){$('#tabs').hidden=true;$('#tok').hidden=false;$('#login').hidden=false;$('#view').innerHTML='\u003cp>Wrong admin token.\u003c/p>';throw new Error('Wrong admin token')}\n  if(!r.ok)throw new Error(d.error||'Something went wrong');\n  return d;\n}\nconst send=(url,method,body)=>api(url,{method,body:body===undefined?undefined:JSON.stringify(body)});\nasync function download(url,name){\n  const r=await fetch(url,{headers:auth()});if(!r.ok)throw new Error('Download failed');\n  const a=document.createElement('a');a.href=URL.createObjectURL(await r.blob());a.download=name;document.body.append(a);a.click();a.remove();\n  setTimeout(()=>URL.revokeObjectURL(a.href),5000);\n}\nasync function run(fn,msg){try{await fn();if(msg)toast(msg)}catch(e){toast(e.message)}}\n\n// ---------- Orders\nlet oLoc='all',oSort='pickup',orders=[];\nasync function showOrders(){orders=await api('/api/admin/orders');if(!locs.length)locs=await api('/api/admin/locations');renderOrders()}\nfunction renderOrders(){\n  const pk=o=>(o.pickupDate||'9999')+' '+(o.pickupTime||'');\n  let os=orders.filter(o=>oLoc==='all'||o.location===oLoc);\n  os=oSort==='pickup'?[...os].sort((a,b)=>pk(a).localeCompare(pk(b))):os;\n  const open=os.filter(o=>o.status!=='picked-up'&&o.status!=='cancelled').length;\n  $('#view').innerHTML=`\u003cdiv class=\"bar\">\u003cselect id=\"oLoc\" aria-label=\"Location\">\u003coption value=\"all\">All locations\u003c/option>${locs.map(l=>`\u003coption value=\"${esc(l.id)}\"${oLoc===l.id?' selected':''}>${esc(l.city)} ${esc(l.kind.toLowerCase())}\u003c/option>`).join('')}\u003c/select>\n   \u003cselect id=\"oSort\" aria-label=\"Sort\">\u003coption value=\"pickup\"${oSort==='pickup'?' selected':''}>By pickup time\u003c/option>\u003coption value=\"new\"${oSort==='new'?' selected':''}>Newest first\u003c/option>\u003c/select>\u003c/div>\n  \u003cp class=\"m\">${os.length} orders · ${open} still to prepare or pick up\u003c/p>\n  ${os.map(o=>`\u003cdiv class=\"card${o.status==='picked-up'||o.status==='cancelled'?' off':''}\">\u003cdiv class=\"bar\" style=\"justify-content:space-between\">\u003cstrong>${esc(o.id)} · ${esc(o.name)}\u003c/strong>\n   \u003cspan class=\"bar\">\u003cselect data-o=\"${esc(o.id)}\" aria-label=\"Status\">${ST.map(s=>`\u003coption${s===o.status?' selected':''}>${s}\u003c/option>`).join('')}\u003c/select>\u003c/span>\u003c/div>\n   ${o.type==='preorder'?`\u003cdiv>\u003cspan class=\"pill\">Pre-order\u003c/span> \u003cstrong>${o.quantity} × ${esc(o.choice)}\u003c/strong> · ${esc(o.locationLabel||o.location)}\u003c/div>`:`\u003cdiv>\u003cstrong>Pickup: ${esc(o.when)}\u003c/strong> · ${esc(o.locationLabel||o.location)}\u003c/div>`}\n   \u003cdiv class=\"m\">${esc(o.phone)} · ordered ${new Date(o.createdAt).toLocaleString()}\u003c/div>\n   ${o.lines.length?`\u003cul>${o.lines.map(l=>`\u003cli>${esc(l.name)} (PLU ${l.plu}): ${l.qty} ${l.unit}${l.options&&Object.keys(l.options).length?` · \u003cem>${esc(Object.values(l.options).join(', '))}\u003c/em>`:''} · ${money(l.price)}\u003c/li>`).join('')}\u003c/ul>`:''}\n   \u003cdiv>${o.type==='preorder'?'\u003cstrong>Price to confirm on WhatsApp\u003c/strong>':`\u003cstrong>Estimate $${o.estimate.toFixed(2)}\u003c/strong>`}${o.notes?` · ${esc(o.notes)}`:''}\u003c/div>\u003c/div>`).join('')||'\u003cp>No orders yet.\u003c/p>'}`;\n}\n\n// ---------- Inventory\nconst cats=()=>[...new Set(items.map(i=>i.category))];\nfunction itemForm(i={}){\n  return `\u003cdiv class=\"grid\">\n   ${i.plu?'':'\u003clabel>PLU #\u003cinput name=\"plu\" inputmode=\"numeric\" required>\u003c/label>'}\n   \u003clabel>Name\u003cinput name=\"name\" value=\"${esc(i.name)}\" maxlength=\"80\" required>\u003c/label>\n   \u003clabel>Category\u003cinput name=\"category\" list=\"catlist\" value=\"${esc(i.category)}\" maxlength=\"40\" required>\u003c/label>\n   \u003clabel>Price ($)\u003cinput name=\"price\" inputmode=\"decimal\" value=\"${i.price??''}\" placeholder=\"Empty = ask for price\">\u003c/label>\n   \u003clabel>Special price ($)\u003cinput name=\"specialPrice\" inputmode=\"decimal\" value=\"${i.specialPrice??''}\" placeholder=\"Empty = no special\">\u003c/label>\n   \u003clabel>Sold by\u003cselect name=\"unit\">${[['lb','Pound (lb)'],['pc','Piece / each'],['pack','Pack']].map(([v,t])=>`\u003coption value=\"${v}\"${(i.unit||'lb')===v?' selected':''}>${t}\u003c/option>`).join('')}\u003c/select>\u003c/label>\n   \u003clabel>Barcode\u003cspan class=\"bc\">\u003cinput name=\"barcode\" value=\"${esc(i.barcode||(!i.plu?newBarcode:''))}\" inputmode=\"numeric\" maxlength=\"32\" placeholder=\"Scan or type\">\u003cbutton type=\"button\" class=\"g\" data-a=\"gen\" title=\"Make an in-store barcode from the PLU\">Make\u003c/button>\u003c/span>\u003c/label>\n  \u003c/div>\n  ${(settings.optionGroups||[]).length?`\u003cdiv class=\"optpick\">\u003cspan>Customer can choose:\u003c/span>${settings.optionGroups.map(g=>`\u003clabel class=\"sw\">\u003cinput type=\"checkbox\" data-og=\"${g.id}\"${(i.options||[]).includes(g.id)?' checked':''}> ${esc(g.label)}\u003c/label>`).join('')}\u003c/div>`:''}`;\n}\nconst formData=el=>Object.fromEntries([...el.querySelectorAll('[name]')].map(x=>[x.name,x.value]));\nconst bcView=c=>c?(isValidGtin(c)?`\u003cdiv class=\"barcode\">${svg(c,{height:40,module:1.5})}\u003c/div>`:`\u003cdiv class=\"m\">Barcode: ${esc(c)}\u003c/div>`):'';\nfunction visible(){return items.filter(i=>(cat==='All'||i.category===cat)&&(!q||i.name.toLowerCase().includes(q)||String(i.plu)===q||String(i.plu).startsWith(q)||(i.barcode||'').includes(q)))}\nfunction renderItems(){\n  const list=visible(), nOff=items.filter(i=>!i.active).length, nBc=items.filter(i=>i.barcode).length;\n  const camOk='BarcodeDetector' in window;\n  $('#view').innerHTML=`\u003cdatalist id=\"catlist\">${cats().map(c=>`\u003coption value=\"${esc(c)}\">`).join('')}\u003c/datalist>\n  ${settings.barcodeOn?`\u003cdiv class=\"card\">\u003ch2>Scan\u003c/h2>\u003cdiv class=\"bar\">\u003cinput id=\"scan\" placeholder=\"Scan a barcode with your scanner, or type it and press Enter\" aria-label=\"Scan barcode\" autocomplete=\"off\" style=\"flex:1 1 260px\">${camOk?'\u003cbutton class=\"g\" data-a=\"cam\">Use camera\u003c/button>':''}\u003c/div>\n   \u003cp class=\"m\" style=\"margin:0\">USB and Bluetooth scanners work like a keyboard: click the box, then scan.${settings.scaleLabelsOn?' Scale labels are read by their PLU.':''}\u003c/p>\u003c/div>`:''}\n  \u003cdiv class=\"card\">\u003ch2>Import &amp; export\u003c/h2>\u003cdiv class=\"bar\">\n   \u003cbutton class=\"g\" data-a=\"export\">Export CSV\u003c/button>\u003clabel class=\"btn\">Import CSV\u003cinput type=\"file\" accept=\".csv,text/csv\" data-a=\"import\">\u003c/label>\n   \u003cbutton class=\"g\" data-a=\"template\">Download template\u003c/button>\u003cbutton class=\"g\" data-a=\"labels\">Print barcode labels\u003c/button>\u003c/div>\n   ${importResult?`\u003cdiv class=\"card\" style=\"background:var(--bg)\">\u003cstrong>${importResult.applied?'Import done':'Import preview'}: ${importResult.added} new · ${importResult.updated} changed · ${importResult.unchanged} unchanged\u003c/strong>\n    ${importResult.errors.length?`\u003cdiv class=\"errs\">${importResult.errors.map(e=>`Line ${e.line}: ${esc(e.message)}`).join('\u003cbr>')}\u003c/div>\u003cp class=\"m\" style=\"margin:0\">Fix these lines in the file and import again. Nothing was changed.\u003c/p>`:''}\n    \u003cdiv class=\"bar\">${!importResult.applied&&!importResult.errors.length?'\u003cbutton class=\"y\" data-a=\"apply\">Apply import\u003c/button>':''}\u003cbutton class=\"g\" data-a=\"closeimp\">Close\u003c/button>\u003c/div>\u003c/div>`:''}\n  \u003c/div>\n  \u003cdetails class=\"card\" id=\"addItem\"${newBarcode?' open':''}>\u003csummary>+ Add a new item\u003c/summary>${itemForm()}\u003cdiv class=\"bar\">\u003cbutton class=\"y\" data-a=\"create\">Save item\u003c/button>\u003c/div>\u003c/details>\n  \u003cdiv class=\"bar\">\u003cinput type=\"search\" id=\"q\" placeholder=\"Search name, PLU or barcode\" value=\"${esc(q)}\" aria-label=\"Search inventory\">\n   \u003cselect id=\"cat\" aria-label=\"Category\">${['All',...cats()].map(c=>`\u003coption${c===cat?' selected':''}>${esc(c)}\u003c/option>`).join('')}\u003c/select>\u003c/div>\n  \u003cp class=\"m\">${items.length} items · ${nOff} hidden · ${nBc} with barcodes\u003c/p>\n  ${list.map(i=>`\u003cdiv class=\"card${i.active?'':' off'}${hit===i.plu?' hit':''}\" data-plu=\"${i.plu}\">\n   \u003cdiv class=\"row\">${i.image?`\u003cimg class=\"thumb\" src=\"${esc(i.image.startsWith('data:')?i.image:'/uploads/'+i.image)}\" alt=\"\">`:'\u003cdiv class=\"thumb\">No photo\u003c/div>'}\n    \u003cdiv>\u003cstrong>${esc(i.name)}\u003c/strong>\u003cdiv class=\"m\">PLU ${i.plu} · ${esc(i.category)} · ${money(i.price)}${i.price!=null?'/'+i.unit:''}${i.specialPrice!=null?` · \u003cspan class=\"pill ok\">Special $${Number(i.specialPrice).toFixed(2)}\u003c/span>`:''}${(i.options||[]).length?` · options: ${esc(i.options.map(id=>(settings.optionGroups||[]).find(g=>g.id===id)?.label||id).join(', '))}`:''}\u003c/div>\n     ${bcView(i.barcode)}\n     \u003clabel class=\"sw\">\u003cinput type=\"checkbox\" data-a=\"toggle\"${i.active?' checked':''}> ${i.active?'Showing on site':'Hidden'}\u003c/label>\u003c/div>\n    \u003cdiv class=\"acts\">\u003cbutton class=\"g\" data-a=\"edit\">Edit\u003c/button>\n     \u003clabel class=\"btn\">${i.image?'Change photo':'Add photo'}\u003cinput type=\"file\" accept=\"image/*\" data-a=\"photo\">\u003c/label>\n     ${i.image?'\u003cbutton class=\"g\" data-a=\"nophoto\">Remove photo\u003c/button>':''}\n     \u003cbutton class=\"r\" data-a=\"del\">${armed===i.plu?'Tap again to delete':'Delete'}\u003c/button>\u003c/div>\u003c/div>\n   ${editing===i.plu?`\u003cdiv class=\"ed\">${itemForm(i)}\u003cdiv class=\"bar\">\u003cbutton class=\"y\" data-a=\"save\">Save changes\u003c/button>\u003cbutton class=\"g\" data-a=\"cancel\">Cancel\u003c/button>\u003c/div>\u003c/div>`:''}\n  \u003c/div>`).join('')||'\u003cp>No items match.\u003c/p>'}`;\n}\nasync function loadItems(){items=await api('/api/admin/items');renderItems()}\nasync function shrink(file){\n  const img=await createImageBitmap(file);\n  const s=Math.min(1,1200/Math.max(img.width,img.height));\n  const c=document.createElement('canvas');c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);\n  c.getContext('2d').drawImage(img,0,0,c.width,c.height);\n  return c.toDataURL('image/jpeg',0.85);\n}\nfunction itemBody(d,el){const out={...d,price:d.price.trim()===''?null:d.price,specialPrice:(d.specialPrice||'').trim()===''?null:d.specialPrice};if(el)out.options=[...el.querySelectorAll('[data-og]')].filter(c=>c.checked).map(c=>c.dataset.og);return out}\n\n// CSV reading: handles quotes, commas inside quotes, Excel's BOM and Windows line endings.\nfunction parseCsv(text){\n  text=text.replace(/^﻿/,'');const rows=[];let row=[],cell='',inQ=false;\n  for(let i=0;i\u003ctext.length;i++){const ch=text[i];\n    if(inQ){if(ch==='\"'){if(text[i+1]==='\"'){cell+='\"';i++}else inQ=false}else cell+=ch}\n    else if(ch==='\"')inQ=true;else if(ch===','){row.push(cell);cell=''}\n    else if(ch==='\\n'||ch==='\\r'){if(ch==='\\r'&&text[i+1]==='\\n')i++;row.push(cell);rows.push(row);row=[];cell=''}\n    else cell+=ch}\n  if(cell||row.length){row.push(cell);rows.push(row)}\n  const clean=rows.filter(r=>r.some(c=>c.trim()));\n  if(!clean.length)throw new Error('The file is empty.');\n  const head=clean[0].map(h=>h.trim().toLowerCase());\n  for(const need of ['plu','name','category'])if(!head.includes(need))throw new Error(`The file needs a \"${need}\" column. Download the template to see the format.`);\n  const COLS=['plu','name','category','price','special_price','unit','options','active','barcode'];\n  return clean.slice(1).map(r=>Object.fromEntries(head.map((h,i)=>[h,(r[i]??'').trim().replace(/^'(?=[=+\\-@])/,'')]).filter(([h])=>COLS.includes(h))));\n}\nasync function previewImport(file){\n  importRows=parseCsv(await file.text());\n  importResult=await send('/api/admin/items/import?dryRun=1','POST',{rows:importRows});\n  renderItems();\n}\nfunction printLabels(){\n  const list=visible().filter(i=>isValidGtin(i.barcode||''));\n  if(!list.length){toast('No items with barcodes in this list. Use \"Make\" on an item to create one.');return}\n  const w=window.open('','_blank');if(!w){toast('Allow pop-ups to print labels.');return}\n  w.document.write(`\u003c!DOCTYPE html>\u003ctitle>Labels\u003c/title>\u003cstyle>body{font:13px system-ui;margin:12px}.g{display:grid;grid-template-columns:repeat(auto-fill,minmax(2.6in,1fr));gap:10px}.l{border:1px dashed #bbb;padding:8px;break-inside:avoid;text-align:center}.l b{display:block}.l svg{max-width:100%;height:auto}@media print{.l{border-color:#ddd}}\u003c/style>\n  \u003cdiv class=\"g\">${list.map(i=>`\u003cdiv class=\"l\">\u003cb>${esc(i.name)}\u003c/b>PLU ${i.plu}${i.price!=null&&settings.showPrices?` · ${money(i.price)}/${i.unit}`:''}${svg(i.barcode,{height:50,module:2})}\u003c/div>`).join('')}\u003c/div>`);\n  w.document.close();w.focus();setTimeout(()=>w.print(),300);\n}\nfunction handleScan(raw){\n  const code=String(raw).trim();if(!code)return;\n  let item=items.find(i=>i.barcode===code),how='barcode';\n  if(!item&&settings.scaleLabelsOn){const s=parseScaleLabel(code);if(s){item=items.find(i=>i.plu===s.plu);how=`scale label ($${s.price.toFixed(2)})`}}\n  if(item){q='';cat='All';hit=item.plu;editing=null;newBarcode='';renderItems();document.querySelector(`[data-plu=\"${item.plu}\"]`)?.scrollIntoView({block:'center'});toast(`Found ${item.name} by ${how}`)}\n  else{newBarcode=code;hit=null;renderItems();$('#addItem').scrollIntoView({block:'start'});toast('No item has this barcode yet. Fill in the form to add it.')}\n}\nasync function cameraScan(){\n  const fmts=(await BarcodeDetector.getSupportedFormats()).filter(f=>['ean_13','upc_a','ean_8','upc_e','code_128'].includes(f));\n  const det=new BarcodeDetector({formats:fmts});\n  const box=document.createElement('div');box.className='cam';box.innerHTML='\u003cvideo playsinline muted>\u003c/video>\u003cbutton class=\"y\">Cancel\u003c/button>';document.body.append(box);\n  const v=box.querySelector('video');let stream,stop=false;\n  const end=()=>{stop=true;stream?.getTracks().forEach(t=>t.stop());box.remove()};\n  box.querySelector('button').onclick=end;\n  try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});v.srcObject=stream;await v.play()}catch(e){end();toast('Camera not available.');return}\n  while(!stop){try{const r=await det.detect(v);if(r[0]){end();handleScan(r[0].rawValue);return}}catch(e){}await new Promise(r=>setTimeout(r,250))}\n}\n\n// ---------- Locations\nconst ORDER=['mon','tue','wed','thu','fri','sat','sun'];\nconst opt=(v,cur,label)=>`\u003coption value=\"${v}\"${String(v)===String(cur)?' selected':''}>${label}\u003c/option>`;\nfunction chips(dates){return dates.map(d=>`\u003cspan class=\"chip\">${new Date(d+'T00:00:00Z').toLocaleDateString('en-US',{timeZone:'UTC',weekday:'short',month:'short',day:'numeric',year:'numeric'})}\u003cbutton type=\"button\" data-a=\"rmcd\" data-d=\"${d}\" aria-label=\"Remove ${d}\">×\u003c/button>\u003c/span>`).join('')||'\u003cspan class=\"m\">None\u003c/span>'}\nfunction locForm(l={}){\n  const pk=l.pickup||defaultPickup(l.kind);\n  return `\u003cdiv class=\"grid\">\n   \u003clabel>Type\u003cselect name=\"kind\">\u003coption${l.kind!=='Truck'?' selected':''}>Storefront\u003c/option>\u003coption${l.kind==='Truck'?' selected':''}>Truck\u003c/option>\u003c/select>\u003c/label>\n   \u003clabel>City\u003cinput name=\"city\" value=\"${esc(l.city)}\" maxlength=\"40\" required>\u003c/label>\n   \u003clabel>Street address\u003cinput name=\"address\" value=\"${esc(l.address)}\" maxlength=\"100\" required>\u003c/label>\n   \u003clabel>City, state ZIP\u003cinput name=\"cityLine\" value=\"${esc(l.cityLine)}\" placeholder=\"Tempe, AZ 85281\" maxlength=\"60\" required>\u003c/label>\n   \u003clabel>Note for customers (optional)\u003cinput name=\"schedule\" value=\"${esc(l.schedule)}\" placeholder=\"e.g. Truck parks next to the gas station\" maxlength=\"120\">\u003c/label>\n  \u003c/div>\n  \u003cfieldset class=\"hrs\">\u003clegend>Pickup hours\u003c/legend>\n   ${ORDER.map(d=>{const h=pk.hours[d];return `\u003cdiv class=\"hr\">\u003clabel class=\"sw\">\u003cinput type=\"checkbox\" data-day=\"${d}\" data-k=\"open\"${h.open?' checked':''}> ${DAY_NAMES[d]}\u003c/label>\n    \u003cinput type=\"time\" data-day=\"${d}\" data-k=\"from\" value=\"${h.from}\" step=\"900\" aria-label=\"${DAY_NAMES[d]} opens\">\u003cspan class=\"m\">to\u003c/span>\u003cinput type=\"time\" data-day=\"${d}\" data-k=\"to\" value=\"${h.to}\" step=\"900\" aria-label=\"${DAY_NAMES[d]} closes\">\u003c/div>`}).join('')}\n   \u003cdiv class=\"bar\">\u003cbutton type=\"button\" class=\"g\" data-a=\"samehrs\">Use Monday's hours for every open day\u003c/button>\u003c/div>\n  \u003c/fieldset>\n  \u003cdiv class=\"grid\">\n   \u003clabel>Pickup times every\u003cselect data-k=\"slotMinutes\">${opt(15,pk.slotMinutes,'15 minutes')}${opt(30,pk.slotMinutes,'30 minutes')}${opt(60,pk.slotMinutes,'1 hour')}\u003c/select>\u003c/label>\n   \u003clabel>Minimum notice\u003cselect data-k=\"leadMinutes\">${opt(0,pk.leadMinutes,'None')}${opt(30,pk.leadMinutes,'30 minutes')}${opt(60,pk.leadMinutes,'1 hour')}${opt(120,pk.leadMinutes,'2 hours')}${opt(240,pk.leadMinutes,'4 hours')}${opt(1440,pk.leadMinutes,'1 day')}\u003c/select>\u003c/label>\n   \u003clabel>Customers can book\u003cselect data-k=\"daysAhead\">${[1,2,3,7,14].map(n=>opt(n,pk.daysAhead,n===1?'Today only':`Up to ${n} days ahead`)).join('')}\u003c/select>\u003c/label>\n   \u003clabel>Orders per pickup time\u003cinput data-k=\"maxPerSlot\" type=\"number\" min=\"0\" max=\"99\" value=\"${pk.maxPerSlot}\" inputmode=\"numeric\">\u003cspan class=\"m\" style=\"font-weight:400\">0 = no limit\u003c/span>\u003c/label>\n  \u003c/div>\n  \u003cdiv class=\"cd\">\u003cstrong style=\"font-size:14px\">Closed dates (holidays, Eid, truck off)\u003c/strong>\n   \u003cdiv class=\"bar\">\u003cinput type=\"date\" data-k=\"cdate\" aria-label=\"Closed date\">\u003cbutton type=\"button\" class=\"g\" data-a=\"addcd\">Add closed date\u003c/button>\u003c/div>\n   \u003cdiv class=\"chips\">${chips(pk.closedDates)}\u003c/div>\u003cinput type=\"hidden\" data-k=\"closedDates\" value=\"${pk.closedDates.join(',')}\">\u003c/div>`;\n}\nfunction locData(el){\n  const d=formData(el),k=x=>el.querySelector(`[data-k=\"${x}\"]`).value,hours={};\n  for(const day of ORDER)hours[day]={open:el.querySelector(`[data-day=\"${day}\"][data-k=\"open\"]`).checked,from:el.querySelector(`[data-day=\"${day}\"][data-k=\"from\"]`).value,to:el.querySelector(`[data-day=\"${day}\"][data-k=\"to\"]`).value};\n  return {...d,pickup:{hours,slotMinutes:+k('slotMinutes'),leadMinutes:+k('leadMinutes'),daysAhead:+k('daysAhead'),maxPerSlot:+k('maxPerSlot'),closedDates:k('closedDates')}};\n}\nfunction renderLocs(){\n  $('#view').innerHTML=`\u003cdetails class=\"card\" id=\"addLoc\">\u003csummary>+ Add a new location\u003c/summary>${locForm()}\u003cdiv class=\"bar\">\u003cbutton class=\"y\" data-a=\"lcreate\">Save location\u003c/button>\u003c/div>\u003c/details>\n  ${locs.map(l=>{const pk=l.pickup;return `\u003cdiv class=\"card${l.active?'':' off'}\" data-id=\"${esc(l.id)}\">\n   \u003cdiv class=\"bar\" style=\"justify-content:space-between\">\u003cdiv>\u003cstrong>${esc(l.city)} · ${esc(l.kind)}\u003c/strong>\u003cdiv class=\"m\">${esc(l.address)}, ${esc(l.cityLine)}\u003c/div>\n    ${pk?`\u003cdiv>${esc(hoursSummary(pk))}\u003c/div>\u003cdiv class=\"m\">Pickup every ${pk.slotMinutes} min · ${pk.leadMinutes?`${pk.leadMinutes>=1440?'1 day':pk.leadMinutes>=60?pk.leadMinutes/60+' h':pk.leadMinutes+' min'} notice`:'no notice'} · ${pk.daysAhead} days ahead${pk.maxPerSlot?` · max ${pk.maxPerSlot} per time`:''}${pk.closedDates.length?` · ${pk.closedDates.length} closed date${pk.closedDates.length>1?'s':''}`:''}\u003c/div>`:''}\n    ${l.schedule?`\u003cdiv class=\"m\">Note: ${esc(l.schedule)}\u003c/div>`:''}\n    \u003clabel class=\"sw\">\u003cinput type=\"checkbox\" data-a=\"ltoggle\"${l.active?' checked':''}> ${l.active?'Taking orders':'Hidden'}\u003c/label>\u003c/div>\n   \u003cdiv class=\"acts\">\u003cbutton class=\"g\" data-a=\"ledit\">Edit\u003c/button>\u003cbutton class=\"r\" data-a=\"ldel\">${armed===l.id?'Tap again to delete':'Delete'}\u003c/button>\u003c/div>\u003c/div>\n   ${editing===l.id?`\u003cdiv class=\"led\">${locForm(l)}\u003cdiv class=\"bar\">\u003cbutton class=\"y\" data-a=\"lsave\">Save changes\u003c/button>\u003cbutton class=\"g\" data-a=\"cancel\">Cancel\u003c/button>\u003c/div>\u003c/div>`:''}\n  \u003c/div>`}).join('')}`;\n}\nasync function loadLocs(){locs=await api('/api/admin/locations');renderLocs()}\n\n// ---------- Settings\nconst swp=(k,title,desc)=>`\u003cdiv class=\"set\">\u003cstrong>${title}\u003c/strong>\u003clabel class=\"sw\">\u003cinput type=\"checkbox\" data-po=\"${k}\"${settings.preorder?.[k]?' checked':''}> ${settings.preorder?.[k]?'On':'Off'}\u003c/label>\u003cp>${desc}\u003c/p>\u003c/div>`;\nconst sw=(k,title,desc)=>`\u003cdiv class=\"set\">\u003cstrong>${title}\u003c/strong>\u003clabel class=\"sw\">\u003cinput type=\"checkbox\" name=\"${k}\"${settings[k]?' checked':''}> ${settings[k]?'On':'Off'}\u003c/label>\u003cp>${desc}\u003c/p>\u003c/div>`;\nfunction renderSettings(){\n  const s=settings;\n  $('#view').innerHTML=`\u003cform id=\"setf\" class=\"card\" style=\"gap:14px\" onsubmit=\"return false\">\n   \u003ch2>Business\u003c/h2>\u003cdiv class=\"grid\">\n    \u003clabel>Store name\u003cinput name=\"storeName\" value=\"${esc(s.storeName)}\" maxlength=\"60\">\u003c/label>\n    \u003clabel>WhatsApp number (with country code)\u003cinput name=\"whatsapp\" value=\"${esc(s.whatsapp)}\" inputmode=\"tel\" placeholder=\"14805551212\">\u003c/label>\n    \u003clabel>Phone shown on site\u003cinput name=\"phoneDisplay\" value=\"${esc(s.phoneDisplay)}\" maxlength=\"40\">\u003c/label>\u003c/div>\n   \u003clabel class=\"grid\" style=\"grid-template-columns:1fr\">\u003cspan style=\"font-size:14px;font-weight:600\">Announcement banner (empty = none)\u003c/span>\u003cinput name=\"announcement\" value=\"${esc(s.announcement)}\" maxlength=\"200\" placeholder=\"e.g. Fresh goat arrives Thursday · Closed Friday 12–2 for Jummah\">\u003c/label>\n   \u003cdiv>\u003ch2>Ordering\u003c/h2>\n    ${sw('orderingOpen','Online ordering','When off, customers can still see the menu but can\\'t place orders.')}\n    ${sw('showPrices','Show prices on the website','Turn off to hide prices from customers. Orders still record them.')}\u003c/div>\n   \u003cdiv>\u003ch2>Payments\u003c/h2>\u003cp class=\"m\" style=\"margin:4px 0 8px\">Customers pay at pickup by card, cash or Zelle. Card payments run on your Toast POS; sales, refunds and reports stay there.\u003c/p>\n    \u003clabel class=\"grid\" style=\"grid-template-columns:1fr;max-width:420px\">\u003cspan style=\"font-size:14px;font-weight:600\">Zelle name shown to customers\u003c/span>\u003cinput name=\"zelleName\" value=\"${esc(s.zelleName||'')}\" maxlength=\"60\">\u003c/label>\u003c/div>\n   \u003cdiv>\u003ch2>Cut &amp; preparation options\u003c/h2>\u003cp class=\"m\" style=\"margin:4px 0 8px\">One option per line, as \u003cem>Name: choice, choice\u003c/em>. Then tick which options each item offers in Inventory.\u003c/p>\n    \u003ctextarea name=\"optionGroups\" rows=\"5\" style=\"width:100%\">${esc(optionGroupsText(s.optionGroups||[]))}\u003c/textarea>\u003c/div>\n   \u003cdiv>\u003ch2>Seasonal pre-orders\u003c/h2>\n    ${swp('on','Show pre-orders on the website','A section where customers reserve items ahead, e.g. Qurbani for Eid al-Adha.')}\n    \u003cdiv class=\"grid\">\u003clabel>Menu link text\u003cinput data-po=\"navLabel\" value=\"${esc(s.preorder?.navLabel||'')}\" maxlength=\"20\">\u003c/label>\n     \u003clabel>Title\u003cinput data-po=\"title\" value=\"${esc(s.preorder?.title||'')}\" maxlength=\"80\">\u003c/label>\u003c/div>\n    \u003clabel class=\"grid\" style=\"grid-template-columns:1fr;margin-top:8px\">\u003cspan style=\"font-size:14px;font-weight:600\">Description\u003c/span>\u003ctextarea data-po=\"text\" rows=\"2\" maxlength=\"400\">${esc(s.preorder?.text||'')}\u003c/textarea>\u003c/label>\n    \u003clabel class=\"grid\" style=\"grid-template-columns:1fr;margin-top:8px\">\u003cspan style=\"font-size:14px;font-weight:600\">Choices (one per line)\u003c/span>\u003ctextarea data-po=\"choices\" rows=\"3\">${esc((s.preorder?.choices||[]).join('\\n'))}\u003c/textarea>\u003c/label>\u003c/div>\n   \u003cdiv>\u003ch2>Barcodes &amp; devices\u003c/h2>\n    ${sw('barcodeOn','Barcode scanner','Shows the Scan box on the Inventory tab. Works with USB and Bluetooth scanners, and the phone camera on Android Chrome.')}\n    ${sw('scaleLabelsOn','Read scale labels','Price-embedded labels from a deli scale (starting with 2) are matched to items by PLU. Turn on when the scale is set up.')}\n    \u003cp class=\"m\">A direct live link to a specific scale or POS depends on its model, and can be added later.\u003c/p>\u003c/div>\n   \u003cdiv class=\"bar\">\u003cbutton class=\"y\" data-a=\"saveset\">Save settings\u003c/button>\u003c/div>\n  \u003c/form>\n  \u003cdiv class=\"card\">\u003ch2>Backup\u003c/h2>\u003cp class=\"m\" style=\"margin:0\">Download everything (settings, inventory, locations and orders) as one file. Keep a copy somewhere safe.\u003c/p>\u003cdiv class=\"bar\">\u003cbutton class=\"g\" data-a=\"backup\">Download backup\u003c/button>\u003c/div>\u003c/div>`;\n}\nasync function loadSettings(){settings=await api('/api/admin/settings');renderSettings()}\n\nasync function show(){\n  editing=null;armed=null;hit=null;importResult=null;\n  document.querySelectorAll('#tabs button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.t===tab));\n  try{\n    if(tab==='orders')await showOrders();\n    else if(tab==='items'){settings=await api('/api/admin/settings');await loadItems()}\n    else if(tab==='locs')await loadLocs();\n    else await loadSettings();\n  }catch(e){toast(e.message)}\n}\n\n$('#login').addEventListener('click',async()=>{try{sessionStorage.setItem('hl-tok',$('#tok').value)}catch(e){}\n  try{settings=await api('/api/admin/settings');$('#tabs').hidden=false;$('#tok').hidden=true;$('#login').hidden=true;show()}catch(e){toast(e.message)}});\n$('#tabs').addEventListener('click',e=>{const b=e.target.closest('button');if(b){tab=b.dataset.t;show()}});\n$('#view').addEventListener('input',e=>{if(e.target.id==='q'){q=e.target.value.trim().toLowerCase();hit=null;const pos=e.target.selectionStart;renderItems();const n=$('#q');n.focus();n.setSelectionRange(pos,pos)}});\n$('#view').addEventListener('keydown',e=>{if(e.target.id==='scan'&&e.key==='Enter'){e.preventDefault();const v=e.target.value;e.target.value='';handleScan(v);$('#scan')?.focus()}});\n$('#view').addEventListener('change',async e=>{\n  const t=e.target,a=t.dataset.a,card=t.closest('[data-plu],[data-id]');\n  if(t.id==='cat'){cat=t.value;renderItems()}\n  else if(t.id==='oLoc'){oLoc=t.value;renderOrders()}\n  else if(t.id==='oSort'){oSort=t.value;renderOrders()}\n  else if(t.dataset.o)run(async()=>{await send(`/api/admin/orders/${t.dataset.o}/status`,'POST',{status:t.value});const o=orders.find(x=>x.id===t.dataset.o);if(o)o.status=t.value;renderOrders()},'Status updated');\n  else if(a==='toggle')run(async()=>{await send(`/api/admin/items/${card.dataset.plu}`,'PUT',{active:t.checked});await loadItems()},t.checked?'Now showing on the site':'Hidden from customers');\n  else if(a==='ltoggle')run(async()=>{await send(`/api/admin/locations/${card.dataset.id}`,'PUT',{active:t.checked});await loadLocs()},t.checked?'Location is taking orders':'Location hidden');\n  else if(a==='photo'&&t.files[0])run(async()=>{toast('Uploading photo…');await send(`/api/admin/items/${card.dataset.plu}/image`,'POST',{data:await shrink(t.files[0])});await loadItems()},'Photo saved');\n  else if(a==='import'&&t.files[0])run(()=>previewImport(t.files[0]));\n  else if(t.type==='checkbox'&&t.closest('#setf'))t.parentElement.lastChild.textContent=t.checked?' On':' Off';\n});\n$('#view').addEventListener('click',async e=>{\n  const b=e.target.closest('button');if(!b)return;\n  const a=b.dataset.a,card=b.closest('[data-plu],[data-id]');\n  const plu=card&&card.dataset.plu,id=card&&card.dataset.id;\n  if(a!=='del'&&a!=='ldel')armed=null;\n  if(a==='create')run(async()=>{await send('/api/admin/items','POST',itemBody(formData($('#addItem')),$('#addItem')));newBarcode='';await loadItems()},'Item added');\n  else if(a==='gen'){const f=b.closest('.grid'),p=f.querySelector('[name=plu]')?.value||plu;if(!/^\\d+$/.test(p||'')){toast('Enter the PLU first.');return}f.querySelector('[name=barcode]').value=inStoreCode(p)}\n  else if(a==='edit'){editing=Number(plu);hit=null;renderItems()}\n  else if(a==='ledit'){editing=id;renderLocs()}\n  else if(a==='cancel'){editing=null;tab==='items'?renderItems():renderLocs()}\n  else if(a==='save')run(async()=>{await send(`/api/admin/items/${plu}`,'PUT',itemBody(formData(card.querySelector('.ed')),card.querySelector('.ed')));editing=null;await loadItems()},'Saved');\n  else if(a==='nophoto')run(async()=>{await send(`/api/admin/items/${plu}/image`,'DELETE');await loadItems()},'Photo removed');\n  else if(a==='del'){if(armed!==Number(plu)){armed=Number(plu);renderItems()}else run(async()=>{await send(`/api/admin/items/${plu}`,'DELETE');armed=null;await loadItems()},'Item deleted')}\n  else if(a==='export')run(()=>download('/api/admin/items/export.csv','halalicious-inventory.csv'));\n  else if(a==='template'){const blob=new Blob(['﻿plu,name,category,price,special_price,unit,options,active,barcode\\r\\n105,\"Chicken Breast, Boneless\",Chicken,5.49,4.99,lb,cut|skin|bone,yes,400000001050\\r\\n701,Frozen Chicken Seekh Kebab,Frozen foods,,,pack,,yes,\\r\\n'],{type:'text/csv'});const l=document.createElement('a');l.href=URL.createObjectURL(blob);l.download='inventory-template.csv';document.body.append(l);l.click();l.remove()}\n  else if(a==='apply')run(async()=>{importResult=await send('/api/admin/items/import','POST',{rows:importRows});await loadItems()},'Import applied');\n  else if(a==='closeimp'){importResult=null;importRows=null;renderItems()}\n  else if(a==='labels')printLabels();\n  else if(a==='cam')cameraScan();\n  else if(a==='lcreate')run(async()=>{await send('/api/admin/locations','POST',locData(b.closest('details')));await loadLocs()},'Location added');\n  else if(a==='lsave')run(async()=>{await send(`/api/admin/locations/${id}`,'PUT',locData(card.querySelector('.led')));editing=null;await loadLocs()},'Saved');\n  else if(a==='addcd'||a==='rmcd'){const box=b.closest('.cd'),hid=box.querySelector('[data-k=closedDates]');let ds=hid.value?hid.value.split(','):[];\n    if(a==='addcd'){const v=box.querySelector('[data-k=cdate]').value;if(!v){toast('Pick a date first.');return}ds=[...new Set([...ds,v])].sort()}else ds=ds.filter(x=>x!==b.dataset.d);\n    hid.value=ds.join(',');box.querySelector('.chips').innerHTML=chips(ds)}\n  else if(a==='samehrs'){const f=b.closest('.hrs'),from=f.querySelector('[data-day=mon][data-k=from]').value,to=f.querySelector('[data-day=mon][data-k=to]').value;\n    f.querySelectorAll('[data-k=open]').forEach(c=>{if(c.checked){f.querySelector(`[data-day=${c.dataset.day}][data-k=from]`).value=from;f.querySelector(`[data-day=${c.dataset.day}][data-k=to]`).value=to}});toast('Copied. Remember to save.')}\n  else if(a==='ldel'){if(armed!==id){armed=id;renderLocs()}else run(async()=>{await send(`/api/admin/locations/${id}`,'DELETE');armed=null;await loadLocs()},'Location deleted')}\n  else if(a==='saveset')run(async()=>{const f=$('#setf'),d={};f.querySelectorAll('[name]').forEach(x=>{d[x.name]=x.type==='checkbox'?x.checked:x.value});d.preorder={};f.querySelectorAll('[data-po]').forEach(x=>{d.preorder[x.dataset.po]=x.type==='checkbox'?x.checked:x.value});settings=await send('/api/admin/settings','PUT',d);renderSettings()},'Settings saved');\n  else if(a==='backup')run(()=>download('/api/admin/backup',`halalicious-backup-${new Date().toISOString().slice(0,10)}.json`),'Backup downloaded');\n});\nif($('#tok').value)$('#login').click();\n\u003c/script>\n\u003c/body>\n\u003c/html>\n","preorder":"\u003c!DOCTYPE html>\n\u003chtml lang=\"en\">\n\u003chead>\n\u003cmeta charset=\"utf-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\n\u003ctitle>Pre-orders · Halal orks, footer */\n:root{color-scheme:light dark;\n--bg:light-dark(#fffaf0,#1a120e);--ink:light-dark(#1f1612,#f8eedc);--mute:light-dark(#6b5444,#cbb49a);\n--ox:#361e14;--ox2:#1f1612;--saf:#f7c21e;--rust:#ab401f;--leaf:#3c8b37;--cream:#f9e2bf;--card:light-dark(#ffffff,#2a1c15);--line:light-dark(#ecdcbf,#4a3226)}\n:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}\n*{box-sizing:border-box;min-width:0}\nhtml{scroll-behavior:smooth;scroll-padding-top:72px}\nbody{margin:0;background:var(--bg);color:var(--ink);font:17px/1.55 \"Source Sans 3\",system-ui,sans-serif;overflow-x:clip}\nh1,h2,h3{font-family:Archivo,system-ui,sans-serif;line-height:1.05;text-wrap:balance;margin:0}\nh2{font-size:clamp(32px,5vw,48px);font-weight:900}\na{color:inherit}\n.band{padding:clamp(36px,5vw,72px) max(5vw,16px)}\n.wrap{max-width:1240px;margin:0 auto}\nbutton,input,select,textarea{font:inherit;font-size:16px}\n.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 22px;border-radius:999px;border:0;font-weight:700;text-decoration:none;cursor:pointer}\n.btn.y{background:var(--saf);color:#1f1612}.btn.o{background:transparent;color:#fff;box-shadow:inset 0 0 0 2px #ffffff88}\n.btn:focus-visible,button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--saf);outline-offset:2px}\n/* nav */\nnav{position:sticky;top:0;z-index:20;background:var(--ox2);color:#fff}\nnav .wrap{display:flex;align-items:center;gap:16px;padding:10px max(5vw,16px);flex-wrap:wrap}\n.logo{font:900 22px/1 Archivo,sans-serif;text-decoration:none;display:flex;align-items:center;gap:10px}\n.logo b{color:var(--saf)}\n.links{display:flex;gap:4px;margin-left:auto;flex-wrap:wrap}\n.links a{text-decoration:none;padding:10px 12px;border-radius:8px;font-weight:600}\n.links a:hover{background:#ffffff1a}\n.cartbtn{background:var(--saf);color:#1f1612;border:0;border-radius:999px;min-height:44px;padding:0 16px;font-weight:800;cursor:pointer}\n/* hero */\n.hero{background:linear-gradient(180deg,var(--ox2),var(--ox));color:#fff;padding-bottom:0}\n.hero .wrap{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:32px;align-items:end}\n.hero h1{font-size:clamp(40px,6.4vw,72px);font-weight:900}\n.hero p{font-size:19px;max-width:34ch;color:#f3e2c4}\n.badges{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0 24px}\n.badges span{background:#ffffff1f;border-radius:999px;padding:6px 14px;font-weight:600;font-size:15px}\n.cta{display:flex;gap:12px;flex-wrap:wrap;padding-bottom:40px}\n.scene{width:100%;height:auto;display:block}\n/* locations */\n.locs{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:16px;margin-top:28px}\n.loc{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px;display:flex;flex-direction:column;gap:8px}\n.loc .tag{align-self:flex-start;font-size:14px;font-weight:700;padding:4px 12px;border-radius:999px;background:var(--saf);color:#1f1612}\n.loc .tag.t{background:var(--ox);color:#fff}\n.loc h3{font-size:26px;font-weight:800}\n.loc address{font-style:normal;color:var(--mute)}\n.loc .row{display:flex;gap:10px;flex-wrap:wrap;margin-top:auto;padding-top:10px}\n.loc .btn{min-height:44px;padding:0 16px;font-size:16px}\n.loc .btn.m{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 2px var(--line)}\n.loc .btn.s{background:var(--ox);color:#fff}\n.loc.on{outline:3px solid var(--saf)}\n.note{font-size:14px;color:var(--mute);margin-top:14px}\n/* menu */\n.menu{background:var(--ox);color:#fff}\n.menu .sub{color:#f3e2c4;max-width:60ch}\n.tabs{display:flex;gap:8px;overflow-x:auto;padding:22px 0 6px;scrollbar-width:thin}\n.tabs button{flex:none;min-height:44px;padding:0 18px;border-radius:999px;border:0;background:#ffffff1a;color:#fff;font-weight:700;cursor:pointer}\n.tabs button[aria-pressed=true]{background:var(--saf);color:#1f1612}\n.search{width:100%;max-width:420px;min-height:48px;border-radius:12px;border:0;padding:0 16px;margin-top:12px;background:#fff;color:#1f1612}\n.board{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px;margin-top:22px}\n.item{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 12px;align-items:center;background:#fffaf0;color:#1f1612;border-radius:14px;padding:14px 16px}\n.item .n{font-weight:700;line-height:1.25}\n.item .plu{font-size:13px;color:#7a6050}\n.item .p{font:800 20px/1 Archivo,sans-serif;white-space:nowrap;text-align:right}\n.item .p small{font:600 13px \"Source Sans 3\",sans-serif;color:#7a6050}\n.item .ask{font:700 14px \"Source Sans 3\",sans-serif;color:#7a6050;white-space:nowrap}\n.qty{grid-column:1/-1;display:flex;align-items:center;gap:8px;justify-content:flex-end}\n.qty button{width:44px;height:44px;border-radius:12px;border:0;background:var(--ox);color:#fff;font-size:22px;font-weight:700;cursor:pointer}\n.qty .add{width:auto;padding:0 18px;font-size:16px}\n.qty output{min-width:64px;text-align:center;font-weight:700;white-space:nowrap}\n.empty{padding:30px;text-align:center;color:#f3e2c4}\n/* steps */\n.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:20px;margin-top:26px}\n.step{border-top:4px solid var(--saf);padding-top:14px}\n.step h3{font-size:22px;font-weight:800;margin-bottom:6px}\n.step p{margin:0;color:var(--mute)}\n.halal{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:24px;margin-top:30px;display:grid;grid-template-columns:auto minmax(0,1fr);gap:18px;align-items:center}\nfooter{background:var(--ox2);color:#f3e2c4}\nfooter .wrap{display:flex;gap:24px;justify-content:space-between;flex-wrap:wrap}\nfooter a{color:#fff}\n/* cart drawer */\n.drawer{position:fixed;inset:0;z-index:50;display:none}\n.drawer.open{display:block}\n.shade{position:absolute;inset:0;background:#0008}\n.panel{position:absolute;right:0;top:0;bottom:0;width:min(440px,100%);background:var(--bg);color:var(--ink);display:flex;flex-direction:column;box-shadow:-10px 0 40px #0006}\n.panel header{display:flex;justify-content:space-between;align-items:center;padding:18px 20px;background:var(--ox2);color:#fff}\n.panel header h2{font-size:26px}\n.x{width:44px;height:44px;border-radius:12px;border:0;background:#ffffff22;color:#fff;font-size:22px;cursor:pointer}\n.lines{flex:1;overflow:auto;padding:8px 20px}\n.line{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;padding:12px 0;border-bottom:1px solid var(--line)}\n.line .r{text-align:right;font-weight:700;white-space:nowrap}\n.line .c{grid-column:1/-1;display:flex;gap:8px;align-items:center}\n.line .c button{min-width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}\n.form{padding:16px 20px;border-top:1px solid var(--line);display:grid;gap:10px}\n.form label{font-weight:600;font-size:15px;display:grid;gap:4px}\n.form input,.form select,.form textarea{min-height:46px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:8px 12px}\n.tot{display:flex;justify-content:space-between;font:800 20px Archivo,sans-serif}\n.err{color:#d23a3a;font-weight:600;font-size:15px;min-height:1em}\n.fine{font-size:13px;color:var(--mute)}\n@media(max-width:820px){.hero .wrap{grid-template-columns:1fr}.cta{padding-bottom:8px}}\n@media(max-width:600px){.links{display:none}.halal{grid-template-columns:1fr}}\n@media(prefers-reduced-motion:no-preference){.wheel{transform-box:fill-box;transform-origin:center;animation:sp 3s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}}\n.item .ph{grid-column:1/-1;width:calc(100% + 32px);margin:-14px -16px 4px;aspect-ratio:4/3;object-fit:cover;border-radius:14px 14px 0 0;display:block;background:#f1e3c8}\n.loc .sched{margin:0;font-weight:600}\n.announce{background:var(--saf);color:#1f1612;text-align:center;font-weight:700;padding:10px max(5vw,16px)}\n.closed #openCart,.closed .qty,.closed .loc .btn.s{display:none}\n.noprice .item .p,.noprice .item .ask,.noprice .line .r,.noprice .tot,.noprice .line .fine{display:none}\n.pick{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:10px}\n.form .pick label{font-weight:600;font-size:15px;display:grid;gap:4px}\n.form .pick select{min-height:46px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:8px 12px}\n[hidden]{display:none!important}\n\n/* Brand from the Halalicious logo: cream ground, dark brown, rust truck, halal green, yellow */\n.logo img{width:44px;height:auto;display:block}\n.hero{background:radial-gradient(120% 90% at 75% 40%,#fcf3cc 0,var(--cream) 55%,#f1d3a4 100%);color:#1f1612}\n.hero h1{color:#361e14}.hero p{color:#53261a}\n.hero .badges span{background:#361e1414;color:#361e14}\n.hero .btn.y{background:var(--rust);color:#fff}\n.hero .btn.o{color:#361e14;box-shadow:inset 0 0 0 2px #361e1466}\n.hero .wrap{align-items:center}\n.scene{width:min(520px,100%);justify-self:center;filter:drop-shadow(0 18px 30px #361e1440);padding:8px 0 40px}\n.qty button,.loc .btn.s{background:var(--rust)}\n.loc .tag.t{background:var(--rust)}\n.loc .tag{background:var(--saf)}\n.halal svg circle:first-child{fill:var(--leaf)}\n\n/* Specials, preparation options, pre-orders */\n.specials{background:var(--cream);padding-block:clamp(24px,4vw,44px)}\n.specials h2{color:#361e14}\n.splist{display:flex;gap:12px;padding:16px 0 4px;scroll-snap-type:x mandatory}\n.sp{flex:none;scroll-snap-align:start;width:210px;min-height:96px;display:grid;gap:4px;align-content:start;text-align:left;background:#fffaf0;border:2px solid #361e1422;border-radius:16px;padding:12px;cursor:pointer;color:#1f1612;font:inherit}\n.sp img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:10px}\n.spn{font-weight:700;line-height:1.25}.spp{font-size:15px;color:#53261a}.spp b{font:800 19px Archivo,sans-serif;color:var(--rust)}.sp s,.p s{color:#7a6050;font-weight:400;font-size:.75em;margin-right:4px}\n.badge{display:inline-b
