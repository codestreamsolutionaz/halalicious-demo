h=\"80\" required>\u003c/label>\n    \u003clabel>Phone\u003cinput name=\"phone\" type=\"tel\" autocomplete=\"tel\" maxlength=\"20\" required>\u003c/label>\n    \u003clabel>What would you like?\u003cselect name=\"choice\" id=\"poChoice\">\u003c/select>\u003c/label>\n    \u003clabel>How many?\u003cinput name=\"quantity\" type=\"number\" min=\"1\" max=\"20\" value=\"1\" inputmode=\"numeric\">\u003c/label>\n    \u003clabel>Pickup location\u003cselect name=\"location\" id=\"poLoc\">\u003c/select>\u003c/label>\n    \u003clabel>Notes\u003ctextarea name=\"notes\" rows=\"2\" maxlength=\"500\" placeholder=\"Cut style, preferred day, anything else\">\u003c/textarea>\u003c/label>\n    \u003cdiv class=\"err\" id=\"poErr\" role=\"alert\">\u003c/div>\n    \u003cbutton class=\"btn y\" type=\"submit\">Reserve\u003c/button>\n  \u003c/form>\n  \u003cdiv id=\"poDone\" class=\"poform\" hidden>\u003ch3>Reservation \u003cspan id=\"poId\">\u003c/span> received\u003c/h3>\u003cp>Send it to us on WhatsApp so we can confirm.\u003c/p>\u003ca class=\"btn y\" id=\"poWa\" href=\"#\" target=\"_blank\" rel=\"noopener\">Open WhatsApp\u003c/a>\u003cbutton class=\"btn m\" type=\"button\" id=\"poAgain\">Reserve another\u003c/button>\u003c/div>\n  \u003cdiv id=\"poClosed\" class=\"poform\" hidden>\u003ch3>Pre-orders are closed right now\u003c/h3>\u003cp>Check back closer to the season, or message us on WhatsApp.\u003c/p>\u003ca class=\"btn y\" href=\"/\">Back to the menu\u003c/a>\u003c/div>\n\u003c/div>\u003c/main>\n\n\u003cscript>// Seasonal pre-order page (e.g. Qurbani). The owner switches it on and words it in Admin > Settings.\n{\nconst $ = s => document.querySelector(s);\nconst esc = s => String(s).replace(/[&\u003c>\"']/g, c => ({'&':'&amp;','\u003c':'&lt;','>':'&gt;','\"':'&quot;',\"'\":'&#39;'}[c]));\nlet saved = '';\ntry { saved = localStorage.getItem('hl-loc') || ''; } catch (e) {}\n\nasync function init() {\n  try {\n    const [cfg, locs] = await Promise.all(['/api/config', '/api/locations'].map(u => fetch(u).then(r => r.json())));\n    document.querySelectorAll('.brand-name').forEach(el => { el.textContent = cfg.storeName; });\n    const po = cfg.preorder;\n    if (!po || !po.on) { $('#poClosed').hidden = false; return; }\n    document.title = po.title + ' · ' + cfg.storeName;\n    $('#poTitle').textContent = po.title; $('#poText').textContent = po.text;\n    $('#poChoice').innerHTML = po.choices.map(c => `\u003coption>${esc(c)}\u003c/option>`).join('');\n    $('#poLoc').innerHTML = locs.map(l => `\u003coption value=\"${l.id}\"${l.id === saved ? ' selected' : ''}>${esc(l.city)} ${l.kind.toLowerCase()} · ${esc(l.address)}\u003c/option>`).join('');\n    $('#poForm').hidden = false;\n  } catch (e) { console.error(e); $('#poClosed').hidden = false; }\n}\n\n$('#poForm').addEventListener('submit', async e => {\n  e.preventDefault();\n  const f = $('#poForm'), msg = $('#poErr'), d = Object.fromEntries(new FormData(f));\n  msg.textContent = !d.name.trim() ? 'Please add your name.' : !d.phone.trim() ? 'Please add your phone number.' : '';\n  if (msg.textContent) return;\n  const btn = f.querySelector('button[type=submit]'); btn.disabled = true;\n  try {\n    const r = await fetch('/api/preorders', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ ...d, quantity: Number(d.quantity) }) });\n    const out = await r.json(); if (!r.ok) throw new Error(out.error || 'Something went wrong.');\n    f.hidden = true; $('#poDone').hidden = false; $('#poId').textContent = out.id; $('#poWa').href = out.whatsappUrl;\n  } catch (err) { msg.textContent = err.message || 'Could not send. Please try again.'; }\n  finally { btn.disabled = false; }\n});\n$('#poAgain').addEventListener('click', () => { $('#poForm').reset(); $('#poForm').hidden = false; $('#poDone').hidden = true; });\ninit();\n}\n\u003c/script>\n\u003c/body>\n\u003c/html>\n"}</script>
<script>window.Barcode=(()=>{// Barcode helpers shared by the admin page and the server (no libraries needed).
// Supports UPC-A (12 digits) and EAN-13 (13 digits), the formats used on meat labels and by retail scanners.

const L = ['0001101','0011001','0010011','0111101','0100011','0110001','0101111','0111011','0110111','0001011'];
const R = L.map(c => [...c].map(b => b === '0' ? '1' : '0').join(''));
const G = R.map(c => [...c].reverse().join(''));
const PARITY = ['LLLLLL','LLGLGG','LLGGLG','LLGGGL','LGLLGG','LGGLLG','LGGGLG','LGLGLG','LGLGGL','LGGLGL'];

// Standard GS1 check digit for a code without its last digit.
function checkDigit(body) {
  const d = [...body].map(Number).reverse();
  const sum = d.reduce((s, n, i) => s + n * (i % 2 === 0 ? 3 : 1), 0);
  return String((10 - (sum % 10)) % 10);
}
function isValidGtin(code) {
  return /^(\d{12}|\d{13})$/.test(code) && checkDigit(code.slice(0, -1)) === code.slice(-1);
}

// In-store barcode from a PLU: UPC-A starting with 4 (reserved for in-store use), e.g. PLU 105 -> 400000001052.
function inStoreCode(plu) {
  const body = '4' + String(plu).padStart(10, '0');
  return body + checkDigit(body);
}

// Price-embedded scale labels (UPC-A starting with 2): 2 PPPPP C $$$$ C
// returns { plu, price } or null. A 13-digit code with a leading 0 is the same label read as EAN-13.
function parseScaleLabel(code) {
  let c = String(code).trim();
  if (/^0\d{12}$/.test(c)) c = c.slice(1);
  if (!/^2\d{11}$/.test(c) || !isValidGtin(c)) return null;
  return { plu: Number(c.slice(1, 6)), price: Number(c.slice(7, 11)) / 100 };
}

// Returns the bar pattern (string of 1s and 0s) for a valid UPC-A or EAN-13 code, or null.
function pattern(code) {
  if (!isValidGtin(code)) return null;
  const c = code.length === 12 ? '0' + code : code;
  const par = PARITY[+c[0]];
  let bits = '101';
  for (let i = 1; i <= 6; i++) bits += (par[i - 1] === 'L' ? L : G)[+c[i]];
  bits += '01010';
  for (let i = 7; i <= 12; i++) bits += R[+c[i]];
  return bits + '101';
}

// Draws the barcode as an SVG string with the digits underneath.
function svg(code, { height = 60, module = 2, label = true } = {}) {
  const bits = pattern(code);
  if (!bits) return '';
  const quiet = 9 * module, w = bits.length * module + quiet * 2, h = height + (label ? 18 : 0);
  let rects = '', x = 0;
  while (x < bits.length) {
    if (bits[x] === '1') { let n = 1; while (bits[x + n] === '1') n++; rects += `<rect x="${quiet + x * module}" y="0" width="${n * module}" height="${height}"/>`; x += n; }
    else x++;
  }
  const text = label ? `<text x="${w / 2}" y="${h - 3}" text-anchor="middle" font-family="monospace" font-size="14">${code}</text>` : '';
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${w} ${h}" width="${w}" height="${h}" role="img" aria-label="Barcode ${code}"><rect width="${w}" height="${h}" fill="#fff"/><g fill="#000">${rects}</g>${text}</svg>`;
}

return{checkDigit,isValidGtin,inStoreCode,parseScaleLabel,pattern,svg}})();</script>
<script>window.Slots=(()=>{// Pickup time slots, shared by the server and the demo.
// Each location has weekly hours, a slot length, minimum notice, how many days ahead customers can book,
// an optional limit of orders per slot, and closed dates. Times are in the store's time zone.

const DAYS = ['sun', 'mon', 'tue', 'wed', 'thu', 'fri', 'sat'];
const DAY_NAMES = { sun: 'Sun', mon: 'Mon', tue: 'Tue', wed: 'Wed', thu: 'Thu', fri: 'Fri', sat: 'Sat' };
const DEFAULT_TZ = 'America/Phoenix';

function defaultPickup(kind = 'Storefront') {
  const hours = {};
  for (const d of DAYS) hours[d] = kind === 'Truck'
    ? { open: d === 'sat' || d === 'sun', from: '10:00', to: '16:00' }
    : { open: true, from: '10:00', to: '19:00' };
  return { hours, slotMinutes: 30, leadMinutes: 120, daysAhead: 7, maxPerSlot: 0, closedDates: [] };
}

const toMin = t => { const [h, m] = t.split(':').map(Number); return h * 60 + m; };
const pad = n => String(n).padStart(2, '0');
const fromMin = m => `${pad(Math.floor(m / 60))}:${pad(m % 60)}`;
function timeLabel(t) {
  const m = toMin(t), h = Math.floor(m / 60), h12 = h % 12 || 12;
  return `${h12}:${pad(m % 60)} ${h < 12 ? 'AM' : 'PM'}`;
}
const dayMs = 864e5;
const dateKey = ms => new Date(ms).toISOString().slice(0, 10);
const dateMs = key => Date.parse(key + 'T00:00:00Z');
function dateLabel(key, todayKey) {
  const base = new Date(dateMs(key)).toLocaleDateString('en-US', { timeZone: 'UTC', weekday: 'short', month: 'short', day: 'numeric' });
  if (!todayKey) return base;
  const diff = Math.round((dateMs(key) - dateMs(todayKey)) / dayMs);
  return diff === 0 ? `Today, ${base}` : diff === 1 ? `Tomorrow, ${base}` : base;
}

// "Now" in the store's time zone, as a date key and minutes since midnight.
function localNow(tz = DEFAULT_TZ, at = new Date()) {
  const p = Object.fromEntries(new Intl.DateTimeFormat('en-US', { timeZone: tz, year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', hourCycle: 'h23' })
    .formatToParts(at).map(x => [x.type, x.value]));
  return { date: `${p.year}-${p.month}-${p.day}`, minutes: Number(p.hour) * 60 + Number(p.minute) };
}

// Checks what the owner typed in the hours editor. Throws an Error with a plain message if something is off.
function cleanPickup(input, kind) {
  const base = defaultPickup(kind), src = input && typeof input === 'object' ? input : {};
  const out = { hours: {} };
  for (const d of DAYS) {
    const h = (src.hours && src.hours[d]) || base.hours[d];
    const open = h.open === true || h.open === 'true' || h.open === 'on';
    const from = /^\d{2}:\d{2}$/.test(h.from) ? h.from : base.hours[d].from;
    const to = /^\d{2}:\d{2}$/.test(h.to) ? h.to : base.hours[d].to;
    if (open && toMin(to) <= toMin(from)) throw new Error(`${DAY_NAMES[d]}: closing time must be after opening time.`);
    out.hours[d] = { open, from, to };
  }
  const pick = (k, allowed) => { const v = Number(src[k] ?? base[k]); if (!allowed.includes(v)) throw new Error(`Invalid ${k}.`); return v; };
  out.slotMinutes = pick('slotMinutes', [15, 30, 60]);
  out.leadMinutes = pick('leadMinutes', [0, 30, 60, 120, 240, 1440]);
  out.daysAhead = pick('daysAhead', [1, 2, 3, 7, 14]);
  const max = Number(src.maxPerSlot ?? 0);
  if (!(Number.isInteger(max) && max >= 0 && max <= 99)) throw new Error('Orders per slot must be 0 (no limit) to 99.');
  out.maxPerSlot = max;
  const dates = Array.isArray(src.closedDates) ? src.closedDates : String(src.closedDates || '').split(',');

    const it = state.items.find(x => x.plu === Number(r[1])); if (!it) throw new E(404, 'Item not found');
    if (method === 'POST') { if (!/^data:image\/(jpeg|png|webp);base64,/.test(body.data || '')) throw new E(400, 'Please upload a JPG, PNG or WebP photo.'); it.image = body.data; save(); return { image: it.image }; }
    if (method === 'DELETE') { it.image = null; save(); return { ok: true }; }
  }
  if (method === 'GET' && path === '/api/admin/items/export.csv') return ['csv', '﻿' + [CSV_COLS.join(','), ...state.items.map(i => CSV_COLS.map(c => c === 'active' ? (i.active ? 'yes' : 'no') : c === 'special_price' ? csvCell(i.specialPrice) : c === 'options' ? csvCell((i.options || []).join('|')) : csvCell(i[c])).join(','))].join('\r\n')];
  if (method === 'POST' && path === '/api/admin/items/import') {
    const work = state.items.map(x => ({ ...x })), errors = [], seen = new Set(); let added = 0, updated = 0, unchanged = 0;
    (body.rows || []).forEach((row, n) => {
      try {
        const plu = Number(row.plu); if (!Number.isInteger(plu) || plu < 1 || plu > 99999) throw new E(400, 'PLU must be a whole number.');
        if (seen.has(plu)) throw new E(400, `PLU ${plu} appears twice in the file.`); seen.add(plu);
        const i = work.findIndex(x => x.plu === plu), next = { ...cleanItem(row, i >= 0 ? work[i] : {}), plu }; uniqueBarcode(work, next);
        if (i < 0) { work.push(next); added++; } else if (JSON.stringify(work[i]) === JSON.stringify(next)) unchanged++; else { work[i] = next; updated++; }
      } catch (e) { errors.push({ line: n + 2, message: e.message }); }
    });
    const applied = query.get('dryRun') !== '1' && !errors.length;
    if (applied) { state.items = work; save(); }
    return { added, updated, unchanged, errors, applied };
  }
  if (method === 'GET' && path === '/api/admin/backup') return ['json', JSON.stringify({ exportedAt: new Date().toISOString(), ...state }, null, 2)];
  if (method === 'GET' && path === '/api/admin/settings') return state.settings;
  if (method === 'PUT' && path === '/api/admin/settings') { Object.assign(state.settings, cleanSettings(body)); save(); return state.settings; }
  if (method === 'GET' && path === '/api/admin/locations') return state.locations;
  if (method === 'POST' && path === '/api/admin/locations') {
    const l = cleanLocation(body); let id = slug(l.city), n = 2; while (state.locations.some(x => x.id === id)) id = `${slug(l.city)}-${n++}`;
    const out = { id, ...l }; state.locations.push(out); save(); return [201, out];
  }
  if ((r = path.match(/^\/api\/admin\/locations\/([a-z0-9-]+)$/))) {
    const i = state.locations.findIndex(x => x.id === r[1]); if (i < 0) throw new E(404, 'Location not found');
    if (method === 'PUT') { state.locations[i] = { ...cleanLocation(body, state.locations[i]), id: r[1] }; save(); return state.locations[i]; }
    if (method === 'DELETE') {
      if (state.locations.filter(x => x.active).length === 1 && state.locations[i].active) throw new E(400, 'Keep at least one active location.');
      state.locations.splice(i, 1); save(); return { ok: true };
    }
  }
  throw new E(404, 'Not found');
}

// The pages inside the demo call this instead of the real network.
window.demoFetch = async (input, opt = {}) => {
  const url = new URL(typeof input === 'string' ? input : input.url, 'https://demo.local');
  const method = (opt.method || 'GET').toUpperCase();
  let body = {};
  try { body = opt.body ? JSON.parse(opt.body) : {}; } catch (e) {}
  await new Promise(r => setTimeout(r, 120));
  try {
    let out = route(method, url.pathname, url.searchParams, body), status = 200;
    if (Array.isArray(out) && typeof out[0] === 'number') [status, out] = out;
    if (Array.isArray(out) && (out[0] === 'csv' || out[0] === 'json')) return new Response(out[1], { status: 200, headers: { 'Content-Type': out[0] === 'csv' ? 'text/csv' : 'application/json' } });
    return new Response(JSON.stringify(out), { status, headers: { 'Content-Type': 'application/json' } });
  } catch (e) {
    return new Response(JSON.stringify({ error: e.message || 'Something went wrong' }), { status: e.status || 500, headers: { 'Content-Type': 'application/json' } });
  }
};

<script>
{
const P=JSON.parse(document.getElementById('pages').textContent);
const f={store:document.getElementById('store'),admin:document.getElementById('admin')};
const bar=document.getElementById('bar');

new ResizeObserver(fit).observe(bar);fit();

function show(v){
  view=v;
  document.querySelectorAll('.seg button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.v===v));
  f.store.hidden=v!=='store';f.admin.hidden=v!=='admin';
  f[v].srcdoc=P[v]; // reload so each side shows the latest changes
}
window.demoGo=pg=>{f.store.srcdoc=P[pg]}; // customer-site links between the home page and the pre-order page
document.querySelector('.seg').addEventListener('click',e=>{const b=e.target.closest('button');if(b)show(b.dataset.v)});
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'&&view==='store')show('admin');else if(e.key==='ArrowLeft'&&view==='admin')show('store')});
document.getElementById('reset').addEventListener('click',()=>{window.demoReset();show(view);window.demoNote('Demo reset to the starting menu.')});
show(location.hash==='#admin'?'admin':'store');
}
